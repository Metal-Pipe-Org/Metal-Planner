name: "PR-y: wstrzymanie recenzji przy konflikcie"

# Przy PR-ze w konflikcie z bazą GitHub nie uruchamia automatów PR-a — także
# discord.yml dla wystawionej recenzji. Zatwierdzenie takiego PR-a przechodziło
# więc po cichu (#245). Konflikt powstaje zwykle wtedy, gdy coś wjeżdża na
# `main`, więc po każdym pushu do `main` sprawdzamy otwarte PR-y z prośbą
# o recenzję. Te w konflikcie dostają ping autora na Discordzie, a prośby
# o recenzję są zdejmowane: recenzent nie traci czasu na PR, który i tak się
# jeszcze zmieni, a autor po rozwiązaniu konfliktu prosi o recenzję od nowa.
#
# Logika siedzi w `.github/scripts/conflicts.sh`; z `DRY_RUN=1` da się ją
# puścić na prawdziwych PR-ach tokenem tylko do odczytu.
on:
  push:
    branches: [main]

# Dwa merge'e chwilę po sobie: drugi bieg czeka na pierwszy, zamiast drugi raz
# pingować o PR, z którego pierwszy właśnie zdejmuje prośby.
concurrency:
  group: pr-conflicts
  cancel-in-progress: false

permissions:
  # Zdjęcie próśb o recenzję.
  pull-requests: write
  # Tylko na skrypty z `main`.
  contents: read

jobs:
  hold-reviews:
    if: github.repository == 'Metal-Pipe-Org/Metal-Planner'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Pobierz skrypty z main
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Wstrzymaj recenzję PR-ów w konflikcie
        # Prośby zdejmujemy naszym tokenem, a takich zdarzeń GitHub nie
        # przekazuje do discord.yml — na Discorda wysyłamy stąd.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh
          source .discord/.github/scripts/conflicts.sh

          hold_conflicting_reviews
