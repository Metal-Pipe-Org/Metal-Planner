name: Automatyczne testy

# Uruchamiany wyłącznie ręcznie (Actions -> Automatyczne testy -> Run workflow).
# Część testów sięga po data/gtfs.sqlite, którego nie ma w repo, więc na świeżym
# klonie `main` pada ich ponad sto — z `FileNotFoundError` z `gtfs.py`, a nie na
# asercji. Runner tej bazy nie ma, a budowanie jej na każdy bieg trwałoby dłużej
# niż same testy. Automatyczne wyzwalacze wracają, gdy cały zestaw będzie
# hermetyczny, czyli gdy i te testy przejdą na syntetyczne dane
# z `tests/gtfs_builder.py`:
#   push:
#     branches: [main, stable]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q tests
