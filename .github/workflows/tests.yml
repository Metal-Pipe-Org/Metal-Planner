name: Automatyczne testy

# Na runnerze nie ma data/gtfs.sqlite, a testy jej nie potrzebują: dzień
# rozkładu budują same (tests/gtfs_builder.py), a do pliku bazy zaglądają
# w pustą bazę ze schematem (tests/conftest.py). Testy w przeglądarce i emulator
# mapy pomijają się tu same (brak Playwrighta w requirements-dev.txt i brak
# osascript), dlatego liczba i powody pominięć idą na stronę podsumowania -
# zielony wynik nie mówi, ile testów się nie odbyło.
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: |
          set -o pipefail
          pytest -q -rs tests | tee pytest.log

      - if: always()
        run: |
          {
            echo '### Wynik'
            echo
            echo '```'
            tail -n 1 pytest.log
            echo '```'
            echo
            echo '### Pominięte'
            echo
            echo '```'
            grep '^SKIPPED' pytest.log || echo 'brak'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
