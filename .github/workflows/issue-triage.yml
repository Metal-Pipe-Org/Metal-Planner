name: "Zgłoszenia: z przycisku i z zewnątrz"

# Zgłoszenie od kogoś spoza zespołu dostaje etykietę "external". Autor bez
# prawa zapisu nie może jej zdjąć — etykiety i typy zmienia tylko zespół.
# Typu Bug przy zgłoszeniu z przycisku „Zgłoś problem” nie nadajemy: przycisk
# jest dla wszystkich i nie wiadomo, co zgłaszający ma na myśli.
#
# „Spoza zespołu” rozstrzyga pytanie o uprawnienia wprost, nie
# `author_association`: przy prywatnym członkostwie w organizacji kłamie
# (patrz claude-issue.yml). Błąd API ma wywrócić bieg na czerwono, a nie
# udawać obcego.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: github.repository == 'Metal-Pipe-Org/Metal-Planner'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      WHO: ${{ github.event.issue.user.login }}

    steps:
      - name: Etykieta "external" dla autora spoza zespołu
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$REPO/collaborators/$WHO/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) exit 0 ;;
          esac
          gh label create external --repo "$REPO" \
            --color FBCA04 --description "Zgłoszone przez kogoś spoza zespołu" || true
          gh issue edit "$N" --repo "$REPO" --add-label external
          echo "@$WHO spoza zespołu (uprawnienia: $perm) — etykieta \"external\"." \
            | tee -a "$GITHUB_STEP_SUMMARY"
