name: "Zgłoszenia: przypomnienie i zamykanie po ciszy"

# Zasada: 14 dni bez niczyjego wpisu → pytamy autora i przypisanych, czy temat
# jest aktualny, i dajemy etykietę "stale". Kolejne 7 dni ciszy → zamykamy jako „not
# planned" i etykieta "stale" zostaje. Zamknięte nie znika: po etykiecie da
# się je odnaleźć, a otwiera się je jednym kliknięciem.
#
# Aktywność to coś, co znaczy, że ktoś się tematem zajmuje: założenie
# zgłoszenia, wpis człowieka, PR, który na nie wskazuje, PR podpięty
# ręcznie i ponowne otwarcie przez człowieka. To ostatnie musi być
# na liście — inaczej zgłoszenie otwarte bez komentarza po naszym zamknięciu
# miałoby stare przypomnienie nowsze od ostatniej aktywności i następny bieg
# zamknąłby je z powrotem.
# Celowo nie bierzemy `updated_at`: przesuwa go każda zmiana etykiety,
# przypisania czy komentarz bota, więc ręczna etykieta odkładałaby zamknięcie
# w nieskończoność. Ręczne „zamykamy?" od kogoś z zespołu liczy się jako wpis
# i daje autorowi pełne 14 dni od nowa.
#
# Nie ruszamy:
#  • zgłoszeń z etykietą "external blocked" albo zablokowanych przez inne,
#    wciąż otwarte zgłoszenie (GitHubowe „Blocked by") — czekają na coś poza
#    nimi, więc cisza jest tam spodziewana; jeśli mają "stale", zdejmujemy ją,
#  • rodziców z otwartymi pod-zgłoszeniami — praca toczy się w dzieciach,
#    a do rodzica nikt nie pisze. Gdy ostatnie dziecko się zamknie, rodzic
#    wraca pod zwykłą zasadę od razu: jeśli sam milczy od 14 dni, dostaje
#    przypomnienie przy najbliższym biegu, bez czekania od nowa.
#
# Etykietę "stale" zdejmujemy tylko wtedy, gdy jest nasze przypomnienie
# i ktoś po nim odpisał. Nadaną ręcznie bez przypomnienia zostawiamy.
# Zwykle zdejmuje ją od razu stale-unlabel.yml, z tą samą decyzją
# (.github/scripts/stale.sh); bieg dzienny łapie to, co tamten przegapił.
#
# Bieg raz dziennie. Cron chodzi w UTC. Nierówna minuta z rozmysłem — biegi
# planowane na pełne godziny czekają w kolejce GitHuba najdłużej. Jak każdy
# workflow na `schedule`, działa z `main`.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  # Tylko na skrypt wysyłki na Discorda z `main`.
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Pobierz skrypt wysyłki na Discorda
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Przypomnij albo zamknij
        # Przypomnienie i zamknięcie robimy naszym tokenem, a takich zdarzeń
        # GitHub nie przekazuje do discord.yml — na Discorda wysyłamy stąd.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh
          source .discord/.github/scripts/stale.sh

          # Gdy etykieta już jest (np. założona ręcznie), zostaje jak jest.
          gh label create "$LABEL_STALE" --repo "$REPO" --color EDEDED \
            --description "Cisza w zgłoszeniu — przypomnienie wysłane albo zamknięte po ciszy" || true

          # Zablokowane ("external blocked" albo GitHubowe „Blocked by") czekają
          # na coś poza sobą, więc nie dostają przypomnień, a "stale" im
          # zdejmujemy: ma sens tylko tam, gdzie cisza jest niespodziewana.
          gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[]
                  | select(.pull_request | not)
                  | (any(.labels[]; .name == "external blocked")
                     or (.issue_dependencies_summary.blocked_by // 0) > 0) as $blocked
                  | "\(.number) \(.sub_issues_summary.total // 0) \($blocked) \(any(.labels[]; .name == "stale"))"' \
            > "$RUNNER_TEMP/open.txt"

          # Pętla czyta z fd 3, żeby żadne `gh` w środku nie zjadło jej wejścia.
          # Zgłoszenie i komentarze idą przez pliki, nie argumenty — długi wątek
          # przekroczyłby limit długości argumentu.
          while read -r n subs blocked labeled <&3; do
            if [ "$blocked" = true ]; then
              if [ "$labeled" = true ]; then
                remove_stale "$n"
                echo "#$n: zablokowane — zdjęto \"$LABEL_STALE\"" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi

            # Stan dzieci sprawdzamy wprost, a nie licznikiem `completed`
            # z podsumowania — nie mamy pewności, że liczy też zamknięte
            # jako „not planned", a od tego zależy, czy rodzic w ogóle wróci.
            if [ "$subs" -gt 0 ] && [ -n "$(gh api --paginate "repos/$REPO/issues/$n/sub_issues?per_page=100" \
                 --jq '.[] | select(.state == "open") | .number')" ]; then
              continue
            fi

            gh api "repos/$REPO/issues/$n" > "$RUNNER_TEMP/issue.json"
            gh api --paginate "repos/$REPO/issues/$n/timeline?per_page=100" --jq '.[]' \
              | jq -s . > "$RUNNER_TEMP/timeline.json"

            # Jedna decyzja na zgłoszenie: ping / close / unlabel / nic.
            action=$(stale_action "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/timeline.json" \
              "$MARKER" "$LABEL_STALE" "$DAYS_QUIET" "$DAYS_GRACE")

            # Autor najlepiej wie, czy temat jest nadal potrzebny, a przypisani
            # powinni wiedzieć, że to, co mają na sobie, stoi. Autor przypisany
            # sam do siebie dostaje jeden ping, nie dwa.
            who=$(jq -r '[.user.login] + [.assignees[].login] | unique | map("@" + .) | join(" ")' \
              "$RUNNER_TEMP/issue.json")

            case "$action" in
              ping)
                gh issue comment "$n" --repo "$REPO" --body "$MARKER
          $who od ${DAYS_QUIET} dni nic się tu nie dzieje. Czy to zgłoszenie jest nadal potrzebne?

          1. **Tak** — napisz komentarz, dlaczego. Etykieta \"$LABEL_STALE\" zniknie, a licznik ruszy od nowa.
          2. **Nie** — zamknij je od razu: strzałka obok „Close issue” → „Close as not planned”. Przypomnienia ustaną.

          Bez odpowiedzi zamknę je sam za ${DAYS_GRACE} dni jako „not planned”. Nic nie ginie: da się je odnaleźć po etykiecie \"$LABEL_STALE\" i otworzyć ponownie jednym kliknięciem."
                gh issue edit "$n" --repo "$REPO" --add-label "$LABEL_STALE"
                echo "#$n: przypomnienie do $who" | tee -a "$GITHUB_STEP_SUMMARY"
                discord_send warn "" "⏳ Cisza od ${DAYS_QUIET} dni: #$n $(jq -r .title "$RUNNER_TEMP/issue.json")" \
                  "$(jq -r .html_url "$RUNNER_TEMP/issue.json")" \
                  "Czy to zgłoszenie jest nadal potrzebne?
          1. **Tak** — napisz pod nim komentarz, dlaczego.
          2. **Nie** — zamknij je jako „not planned”, a przypomnienia ustaną.
          Bez odpowiedzi zamknie się samo za ${DAYS_GRACE} dni." "" "${who//@/}"
                ;;
              close)
                gh issue comment "$n" --repo "$REPO" --body \
                  "Brak odpowiedzi przez ${DAYS_GRACE} dni — zamykam. Gdy temat wróci, wystarczy otworzyć ponownie."
                # Dokładamy na wypadek, gdyby ktoś zdjął ją ręcznie po przypomnieniu.
                gh issue edit "$n" --repo "$REPO" --add-label "$LABEL_STALE"
                gh issue close "$n" --repo "$REPO" --reason "not planned"
                echo "#$n: zamknięte po ciszy" | tee -a "$GITHUB_STEP_SUMMARY"
                discord_send grey "" "💤 Zamknięte po ciszy: #$n $(jq -r .title "$RUNNER_TEMP/issue.json")" \
                  "$(jq -r .html_url "$RUNNER_TEMP/issue.json")" "" "" "${who//@/}"
                ;;
              unlabel)
                remove_stale "$n"
                echo "#$n: ktoś odpisał — zdjęto \"$LABEL_STALE\"" | tee -a "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done 3< "$RUNNER_TEMP/open.txt"
