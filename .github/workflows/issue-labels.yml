name: "Zgłoszenia: etykiety z PR-ów i zamykanie po merge"

# PR może wskazać zgłoszenie na dwa sposoby i workflow traktuje je inaczej,
# bo znaczą co innego:
#
#  A. Słowem kluczowym — `Fixes #78`, `Closes #64`, `Resolves #9` w tytule
#     albo opisie PR-a; tak samo liczy się nazwa gałęzi solvera
#     (`claude/issue-78-20260903-2030`). Autor deklaruje: ten PR to załatwia.
#       • PR otwarty (także jako wersja robocza) → zgłoszenie dostaje "PR in progress"
#       • merge do `main` → etykieta znika, a zgłoszenie zostaje zamknięte
#     Komentarza o zamknięciu nie dopisujemy: oś czasu zgłoszenia i kanał na
#     Discordzie i tak pokazują, który PR je zamknął.
#
#     Zamyka je zwykle sam GitHub: jego słowa kluczowe działają przy merge do
#     gałęzi domyślnej, a tą jest `main` — czyli baza wszystkich zwykłych
#     PR-ów. Nasz krok zamykający jest zapasem na to, czego GitHub nie łyka:
#     słowo kluczowe w samym TYTULE PR-a (GitHub czyta tylko opis i treść
#     commitów), numer wzięty z nazwy gałęzi solvera (`claude/issue-78-...`)
#     i luźniejsze zapisy, które nasz regexp przepuszcza, a GitHub nie. Gdy
#     zgłoszenie jest już zamknięte, krok schodzi z drogi.
#
#  B. Słowem „dotyczy" — `Refs #78`, `Ref #78`, `Related to #78`,
#     `Relates to #78`, `Part of #78` albo po polsku `Dotyczy #78`. To
#     słowa z konwencji (Conventional Commits, GitLab); `See` i `For`
#     pomijamy, bo padają też w zwykłych odsyłaczach. To luźniejszy związek: PR
#     dotyka tematu, ale nikt nie obiecuje, że go zamyka. Gołe `#78` nie
#     znaczy nic: padało też w zdaniach w rodzaju „to zostaje na #175" i
#     oznaczało jako rozpoczęte zgłoszenie, którego PR wprost nie robi.
#       • PR otwarty (także jako wersja robocza) → zgłoszenie dostaje "PR in progress"
#       • merge → "PR in progress" znika, wchodzi "merged - is it ok?"
#     Zgłoszenia NIE zamykamy — ostatnie słowo ma człowiek, a etykieta jest
#     właśnie prośbą o sprawdzenie. Zdejmuje ją ten, kto zgłoszenie zamknie.
#
# Numer, który padł w obu ścieżkach, liczy się raz — ścieżka A wygrywa.
#
# Dla zgłoszenia PR jest czarną skrzynką: "PR in progress" nie zależy od tego,
# czy PR jest wersją roboczą, czeka na recenzję czy ją przeszedł. Zdejmuje ją
# dopiero zamknięcie PR-a: bez merge'a zgłoszenie zostaje otwarte i znów
# czeka na kogoś.
# Etykiety są czystymi znacznikami stanu — żadna niczego nie uruchamia — i
# zgłoszenie nosi najwyżej jedną z naszych dwóch: nadanie etykiety zdejmuje
# drugą. Cudzych etykiet nie ruszamy — inaczej każda etykieta
# nadana ręcznie znikałaby po cichu przy pierwszym PR-ze, który wspomni
# zgłoszenie (#144).
#
# Plik żyje na `main`: przy `pull_request_target` GitHub bierze workflow
# z gałęzi domyślnej repozytorium (GITHUB_REF wskazuje default branch),
# niezależnie od tego, do której gałęzi celuje PR. Za odsianie PR-ów
# odpowiada filtr `branches`, działający na gałęzi bazowej: etykiety
# obsługujemy dla PR-ów do `main` i do `stable`, a zamykanie tylko dla PR-ów
# do `main` — przy wydaniu `main` -> `stable` te zgłoszenia są już dawno
# zamknięte.
on:
  pull_request_target:
    types: [opened, reopened, edited, closed]
    branches: [main, stable]

# Kodu z PR-a nie pobieramy (żadnego checkoutu), więc `pull_request_target`
# jest tu bezpieczny. Tytuł i treść PR-a wchodzą do skryptu przez env,
# nigdy przez podstawienie ${{ }} w środku basha.
permissions:
  issues: write
  # Tylko na skrypt wysyłki na Discorda z `main`.
  contents: read

env:
  LABEL_PROGRESS: "PR in progress"
  # Dawne etykiety, które znaczyły to samo co "PR in progress". Zgłoszenia
  # mogą je jeszcze nosić, więc traktujemy je jak jej aliasy: schodzą razem
  # z nią. Lista do skasowania, gdy żadne zgłoszenie już ich nie ma.
  LABELS_LEGACY: "PR created|waiting for PR review"
  LABEL_MERGED: "merged - is it ok?"

jobs:
  track-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Zbierz wskazane zgłoszenia
        id: refs
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Ścieżka A: słowa kluczowe w tytule i opisie plus nazwa gałęzi solvera.
          keyword_raw=$(
            {
              printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
                | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" \
                | grep -oE '^claude/issue-[0-9]+' \
                | grep -oE '[0-9]+' || true
            } | sort -u
          )

          # Ścieżka B: `#123` po słowie „dotyczy" (patrz nagłówek), z którego
          # odejmujemy potem numery ze ścieżki A i numer samego PR-a.
          mention_all=$(
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
              | grep -oiE '(^|[^[:alnum:]])(refs?|relate[sd][[:space:]]+to|part[[:space:]]+of|dotyczy)[[:space:]:]*#[0-9]+' \
              | grep -oE '[0-9]+' | sort -u || true
          )
          mention_raw=""
          for n in $mention_all; do
            if [ "$n" = "$PR" ]; then
              continue
            fi
            if printf '%s\n' $keyword_raw | grep -qxF "$n"; then
              continue
            fi
            mention_raw="${mention_raw:+$mention_raw }$n"
          done

          # Numery, które nie są istniejącym zgłoszeniem, odsiewamy raz tutaj —
          # dalsze kroki dostają już gotowe listy. Stanu (otwarte / zamknięte)
          # celowo nie sprawdzamy: etykietę nadajemy tylko otwartym, ale
          # zdejmować ją trzeba także z zamkniętych.
          filter() {
            local out="" n json
            for n in "$@"; do
              if ! json=$(gh api "repos/$REPO/issues/$n" 2>/dev/null); then
                echo "#$n nie istnieje — pomijam." >&2
                continue
              fi
              if [ -n "$(printf '%s' "$json" | jq -r '.pull_request.url // empty')" ]; then
                echo "#$n to PR, nie zgłoszenie — pomijam." >&2
                continue
              fi
              out="${out:+$out }$n"
            done
            printf '%s' "$out"
          }

          keyword=$(filter $keyword_raw)
          mention=$(filter $mention_raw)

          echo "PR #$PR — ze słowem kluczowym: [${keyword:-brak}], samo wspomnienie: [${mention:-brak}]"
          {
            echo "keyword=$keyword"
            echo "mention=$mention"
          } >> "$GITHUB_OUTPUT"

      - name: Nadaj etykiety otwartym zgłoszeniom
        # `edited` jest w wyzwalaczach, bo numer zgłoszenia często dopisuje się
        # do opisu już po otwarciu PR-a. Odwrotny przypadek — ktoś usuwa `#78`
        # z opisu — zostawia na zgłoszeniu nieaktualną etykietę do ręcznego
        # zdjęcia; nie zgadujemy z historii edycji, co zniknęło.
        if: >-
          (steps.refs.outputs.keyword != '' || steps.refs.outputs.mention != '')
          && github.event.action != 'closed'
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          # Pierwszy bieg w repo zakłada etykiety; przy kolejnych `gh` zgłasza
          # „already exists" i to jest w porządku.
          gh label create "$LABEL_PROGRESS" --repo "$REPO" --color 0E8A16 \
            --description "Jest otwarty PR, który dotyczy tego zgłoszenia" || true

          oznacz() {
            local label="$1"; shift
            local n json state other
            local -a args
            for n in "$@"; do
              json=$(gh api "repos/$REPO/issues/$n")
              state=$(printf '%s' "$json" | jq -r .state)
              if [ "$state" != open ]; then
                echo "#$n nie jest otwarte (stan: $state) — nie etykietuję."
                continue
              fi

              # Nadawana etykieta zostaje jedyną z naszych — drugą zdejmujemy. Listę bierzemy z samego zgłoszenia, bo
              # `--remove-label` na etykiecie, której ono nie ma, wywraca całe
              # wywołanie, a razem z nim nadanie nowej.
              args=(--add-label "$label")
              while IFS= read -r other; do
                [ -n "$other" ] || continue
                args+=(--remove-label "$other")
                echo "#$n: zdejmuję \"$other\"" | tee -a "$GITHUB_STEP_SUMMARY"
              done < <(printf '%s' "$json" | jq -r --arg keep "$label" \
                '[$ENV.LABEL_PROGRESS, $ENV.LABEL_MERGED] + ($ENV.LABELS_LEGACY | split("|")) as $ours
                | .labels[].name | select(. != $keep and IN($ours[]))')

              gh issue edit "$n" --repo "$REPO" "${args[@]}"
              echo "#$n: etykieta \"$label\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          }

          [ -n "$KEYWORD" ] && oznacz "$LABEL_PROGRESS" $KEYWORD
          [ -n "$MENTION" ] && oznacz "$LABEL_PROGRESS" $MENTION
          exit 0

      - name: Zdejmij etykietę trwającego PR-a
        if: >-
          (steps.refs.outputs.keyword != '' || steps.refs.outputs.mention != '')
          && github.event.action == 'closed'
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          odznacz() {
            local n json other
            local -a args
            for n in "$@"; do
              # Etykiety mogło nigdy nie być: zgłoszenie sprzed tego workflow
              # albo etykieta zdjęta ręcznie. Zdejmujemy tylko te, które
              # zgłoszenie faktycznie nosi, bo `--remove-label` na brakującej
              # wywraca całe wywołanie.
              json=$(gh api "repos/$REPO/issues/$n")
              args=()
              while IFS= read -r other; do
                [ -n "$other" ] || continue
                args+=(--remove-label "$other")
                echo "#$n: zdejmuję \"$other\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
              done < <(printf '%s' "$json" | jq -r --arg keep "$LABEL_MERGED" \
                '[$ENV.LABEL_PROGRESS, $ENV.LABEL_MERGED] + ($ENV.LABELS_LEGACY | split("|")) as $ours
                | .labels[].name | select(. != $keep and IN($ours[]))')
              if [ "${#args[@]}" -gt 0 ]; then
                gh issue edit "$n" --repo "$REPO" "${args[@]}"
              fi
            done
          }

          [ -n "$KEYWORD" ] && odznacz $KEYWORD
          [ -n "$MENTION" ] && odznacz $MENTION
          exit 0

      - name: Oznacz wspomniane zgłoszenia jako zmergowane
        # Ścieżka B kończy się pytaniem do człowieka, nie zamknięciem: etykieta
        # mówi „PR wszedł, sprawdź, czy to załatwia sprawę". Nasze poprzednie
        # etykiety stanu — także te nadane przez inne PR-y — schodzą razem
        # z nadaniem tej.
        if: >-
          steps.refs.outputs.mention != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
        env:
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          gh label create "$LABEL_MERGED" --repo "$REPO" --color D4C5F9 \
            --description "Wspominający PR jest zmergowany — do sprawdzenia" || true

          for n in $MENTION; do
            json=$(gh api "repos/$REPO/issues/$n")
            state=$(printf '%s' "$json" | jq -r .state)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — nie etykietuję."
              continue
            fi

            args=(--add-label "$LABEL_MERGED")
            while IFS= read -r other; do
              [ -n "$other" ] || continue
              args+=(--remove-label "$other")
              echo "#$n: zdejmuję \"$other\"" | tee -a "$GITHUB_STEP_SUMMARY"
            done < <(printf '%s' "$json" | jq -r --arg keep "$LABEL_MERGED" \
              '[$ENV.LABEL_PROGRESS, $ENV.LABEL_MERGED] + ($ENV.LABELS_LEGACY | split("|")) as $ours
                | .labels[].name | select(. != $keep and IN($ours[]))')

            gh issue edit "$n" --repo "$REPO" "${args[@]}"
            echo "#$n: etykieta \"$LABEL_MERGED\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Pobierz skrypt wysyłki na Discorda
        # Kod z `main`, nie z PR-a — przy `pull_request_target` to bezpieczne.
        if: >-
          steps.refs.outputs.keyword != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'main'
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Zamknij zgłoszenia, których GitHub nie zamknął sam
        # Zapas, nie główna droga. Przy `Closes #78` w opisie PR-a zamknięcie
        # robi GitHub w ramach merge'a, jeszcze zanim wyjdzie webhook, więc ten
        # krok zastaje zgłoszenie zamknięte i schodzi z drogi. Zostaje dla
        # przypadków, których GitHub nie obsługuje: słowo kluczowe tylko
        # w tytule PR-a, numer z nazwy gałęzi solvera, zapis spoza jego listy.
        #
        # Wartownik na stan odsiewa oba przypadki naraz: zgłoszenie zamknięte
        # przed chwilą przez GitHuba i zamknięte dawniej ręcznie (duplikat,
        # „nie robimy"). Żadnego z nich nie chcemy domykać drugi raz.
        #
        # Zamknięcie naszym tokenem GitHub nie przekazuje innym workflow, więc
        # discord.yml go nie zobaczy — wiadomość o zamknięciu, w tym samym
        # kształcie co tam, wysyłamy stąd.
        if: >-
          steps.refs.outputs.keyword != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'main'
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh

          for n in $KEYWORD; do
            json=$(gh api "repos/$REPO/issues/$n")
            state=$(printf '%s' "$json" | jq -r .state)
            if [ "$state" != open ]; then
              echo "#$n zamknął już GitHub (stan: $state) — nie ruszam."
              continue
            fi

            gh issue close "$n" --repo "$REPO" --reason completed
            echo "Zamknięto #$n (PR #$PR) — GitHub tego nie zrobił" \
              | tee -a "$GITHUB_STEP_SUMMARY"

            # Autora pingujemy, chyba że to on zmergował.
            ping=$(printf '%s' "$json" | jq -r .user.login)
            if [ "$ping" = "$MERGER" ]; then
              ping=""
            fi
            discord_send merged "$MERGER" "🔒 Zamknięte PR-em: #$n $(printf '%s' "$json" | jq -r .title)" \
              "$(printf '%s' "$json" | jq -r .html_url)" \
              "PR [#$PR]($PR_URL) $PR_TITLE" "" "$ping"
          done
