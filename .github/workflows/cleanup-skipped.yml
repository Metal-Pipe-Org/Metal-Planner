name: Sprzątanie pominiętych run'ów

# Wyzwalacz `issue_comment` w claude-issue.yml tworzy bieg przy KAŻDYM komentarzu
# w repo — GitHub nie umie filtrować po treści, więc te bez @claude odbija dopiero
# warunek `if` w jobie. Tak samo claude-review-pr.yml pomija PR-y robocze
# i te z forków. Pominięcia nie kosztują minut (job nie dostaje runnera),
# ale zapychają listę w zakładce Actions. Ten workflow je stamtąd usuwa.
#
# claude-review-pr.yml żyje na `testing` (tak każe wyzwalacz `pull_request` —
# szczegóły w nagłówku tamtego pliku), ale sprzątanie i tak działa: biegi
# widnieją w Actions całego repozytorium, niezależnie od gałęzi z plikiem.
#
# Cron chodzi w UTC i nie przesuwa się z czasem letnim: 03:17 UTC to 05:17
# w Polsce latem i 04:17 zimą. Nierówna minuta z rozmysłem — biegi planowane
# na pełne godziny czekają w kolejce GitHuba najdłużej.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Kasowanie biegów wymaga zapisu do Actions. Reszty uprawnień nie dajemy.
permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skasuj pominięte biegi Claude'a
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Tylko nasze workflow — cudzych biegów nie ruszamy.
          WORKFLOWS: "claude-issue.yml claude-review-pr.yml"
        run: |
          set -euo pipefail

          count=0
          for wf in $WORKFLOWS; do
            # Workflow, który nie zdążył jeszcze ani razu wystartować, nie jest
            # GitHubowi znany i API oddaje 404 — to nie powód do wywracania biegu.
            if ! ids=$(gh api \
              "repos/$REPO/actions/workflows/$wf/runs?status=skipped&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null); then
              echo "$wf: brak biegów w tym repo — pomijam."
              continue
            fi

            for id in $ids; do
              echo "Kasuję bieg $id ($wf)"
              gh api -X DELETE "repos/$REPO/actions/runs/$id"
              count=$((count + 1))
            done
          done

          if [ "$count" -eq 0 ]; then
            echo "Nic do sprzątania." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Usunięto pominiętych biegów: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
