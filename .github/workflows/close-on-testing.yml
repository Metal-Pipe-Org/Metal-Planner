name: "PR-y: etykieta recenzji i zamykanie zgłoszeń"

# Dwie sprawy wokół PR-ów, obsługiwane z jednego pliku, bo obie wiszą na tym
# samym zdarzeniu i tej samej parze gałęzi:
#
#  1. Etykieta "waiting for PR review". Dostaje ją każdy otwarty PR, który
#     czeka na recenzję i merge. Znika, gdy PR zostanie zamknięty (zmergowany
#     albo nie) i gdy wróci do wersji roboczej — lista PR-ów pokazuje wtedy
#     jednym rzutem oka, co jeszcze wymaga czyjejś decyzji.
#
#  2. Zamykanie zgłoszeń po merge do `testing`. Słowa kluczowe GitHuba
#     (`Fix #78`) zamykają zgłoszenie dopiero, gdy commit trafi na gałąź
#     domyślną, czyli `main`. PR-y solvera idą do `testing`, więc zgłoszenia
#     wisiałyby otwarte aż do wydania. Zamykamy je od razu po merge do
#     `testing` i zostawiamy w wątku notkę, że na `main` zmiana dopiero czeka.
#
# Plik żyje na `main`: przy `pull_request_target` GitHub bierze workflow
# z gałęzi domyślnej repozytorium (GITHUB_REF wskazuje default branch),
# niezależnie od tego, do której gałęzi celuje PR. Za odsianie PR-ów
# odpowiada filtr `branches`, działający na gałęzi bazowej: etykietujemy
# PR-y do `testing` i do `main`, zgłoszenia zamykamy tylko przy `testing`
# (do `main` idzie wydanie, a te zgłoszenia są już dawno zamknięte).
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
    branches: [testing, main]

# Kodu z PR-a nie pobieramy (żadnego checkoutu), więc `pull_request_target`
# jest tu bezpieczny. Tytuł i treść PR-a wchodzą do skryptu przez env,
# nigdy przez podstawienie ${{ }} w środku basha. Uprawnienia nadajemy
# per job — każdy dostaje tylko to, czego naprawdę używa.

env:
  LABEL: "waiting for PR review"

jobs:
  # Etykieta jest czystym znacznikiem stanu — niczego nie uruchamia.
  #
  # Świadomie NIE reagujemy na `synchronize`: kolejny push nie ma przywracać
  # etykiety zdjętej ręcznie (np. gdy ktoś odłożył PR na później). Wraca ona
  # dopiero przy zamknięciu i ponownym otwarciu albo przy „Ready for review".
  review-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write  # etykiety na PR-ze
      issues: write         # założenie etykiety w repo, gdy jeszcze jej nie ma

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Nadaj etykietę czekającemu PR-owi
        # Wersje robocze pomijamy — zgłasza je do recenzji dopiero
        # „Ready for review", które przychodzi tu osobnym zdarzeniem.
        if: >-
          github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && github.event.pull_request.draft == false
        run: |
          set -euo pipefail

          # Pierwszy bieg w repo zakłada etykietę; przy kolejnych `gh` zgłasza
          # „already exists" i to jest w porządku.
          gh label create "$LABEL" --repo "$REPO" \
            --color FBCA04 --description "PR czeka na recenzję i merge" || true

          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
          echo "PR #$PR: nadano etykietę \"$LABEL\"." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zdejmij etykietę z zamkniętego PR-a
        if: >-
          github.event.action == 'closed'
          || github.event.action == 'converted_to_draft'
        run: |
          set -euo pipefail

          # Etykiety mogło nigdy nie być: PR sprzed tego workflow, PR otwarty
          # jako wersja robocza, etykieta zdjęta ręcznie. Brak etykiety to nie
          # awaria, więc nie wywracamy na tym całego biegu.
          if gh pr edit "$PR" --repo "$REPO" --remove-label "$LABEL"; then
            echo "PR #$PR: zdjęto etykietę \"$LABEL\"." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PR #$PR: nie udało się zdjąć etykiety \"$LABEL\" — najpewniej jej nie miał." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  close-issues:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Zamknij powiązane zgłoszenia
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Numery zbieramy z dwóch źródeł:
          #  1. słowa kluczowe w tytule i opisie PR-a (Fix #78, Closes #64, ...),
          #  2. nazwa gałęzi solvera — `claude/issue-78-20260903-2030`.
          numbers=$(
            {
              printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
                | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" \
                | grep -oE '^claude/issue-[0-9]+' \
                | grep -oE '[0-9]+' || true
            } | sort -u
          )

          if [ -z "$numbers" ]; then
            echo "PR #$PR nie wskazuje żadnego zgłoszenia." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for n in $numbers; do
            # Pomiń numery, które są PR-em, a nie zgłoszeniem.
            if [ -n "$(gh api "repos/$REPO/issues/$n" --jq '.pull_request.url // empty' 2>/dev/null)" ]; then
              echo "#$n to PR — pomijam."
              continue
            fi

            state=$(gh api "repos/$REPO/issues/$n" --jq .state 2>/dev/null || echo brak)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — pomijam."
              continue
            fi

            gh issue comment "$n" --repo "$REPO" --body \
              "Rozwiązane w #$PR. Zmiana jest na gałęzi \`testing\`; na \`main\` trafi przy najbliższym wydaniu."
            gh issue close "$n" --repo "$REPO" --reason completed

            echo "Zamknięto #$n (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
