name: Zamknij issue po merge do testing

# Słowa kluczowe GitHuba (`Fix #78`) zamykają zgłoszenie dopiero, gdy commit
# trafi na gałąź domyślną, czyli `main`. PR-y solvera idą do `testing`, więc
# zgłoszenia wisiałyby otwarte aż do wydania. Ten workflow zamyka je od razu
# po merge do `testing` i zostawia w wątku notkę, że na `main` zmiana dopiero
# czeka.
#
# UWAGA: plik musi żyć na gałęzi `testing` — przy `pull_request_target`
# GitHub czyta workflow z gałęzi bazowej PR-a, a nie z `main`.
on:
  pull_request_target:
    types: [closed]
    branches: [testing]

# Kodu z PR-a nie pobieramy (żadnego checkoutu), więc `pull_request_target`
# jest tu bezpieczny. Tytuł i treść PR-a wchodzą do skryptu przez env,
# nigdy przez podstawienie ${{ }} w środku basha.
permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Zamknij powiązane zgłoszenia
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Numery zbieramy z dwóch źródeł:
          #  1. słowa kluczowe w tytule i opisie PR-a (Fix #78, Closes #64, ...),
          #  2. nazwa gałęzi solvera — `claude/issue-78-20260903-2030`.
          numbers=$(
            {
              printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
                | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" \
                | grep -oE '^claude/issue-[0-9]+' \
                | grep -oE '[0-9]+' || true
            } | sort -u
          )

          if [ -z "$numbers" ]; then
            echo "PR #$PR nie wskazuje żadnego zgłoszenia." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for n in $numbers; do
            # Pomiń numery, które są PR-em, a nie zgłoszeniem.
            if [ -n "$(gh api "repos/$REPO/issues/$n" --jq '.pull_request.url // empty' 2>/dev/null)" ]; then
              echo "#$n to PR — pomijam."
              continue
            fi

            state=$(gh api "repos/$REPO/issues/$n" --jq .state 2>/dev/null || echo brak)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — pomijam."
              continue
            fi

            gh issue comment "$n" --repo "$REPO" --body \
              "Rozwiązane w #$PR. Zmiana jest na gałęzi \`testing\`; na \`main\` trafi przy najbliższym wydaniu."
            gh issue close "$n" --repo "$REPO" --reason completed

            echo "Zamknięto #$n (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
