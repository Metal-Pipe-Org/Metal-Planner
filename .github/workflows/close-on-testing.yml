name: "Zgłoszenia: etykiety z PR-ów i zamykanie po merge"

# PR może wskazać zgłoszenie na dwa sposoby i workflow traktuje je inaczej,
# bo znaczą co innego:
#
#  A. Słowem kluczowym — `Fixes #78`, `Closes #64`, `Resolves #9` w tytule
#     albo opisie PR-a; tak samo liczy się nazwa gałęzi solvera
#     (`claude/issue-78-20260903-2030`). Autor deklaruje: ten PR to załatwia.
#       • PR otwarty  → zgłoszenie dostaje "waiting for PR review"
#       • merge do `testing` → etykieta znika, zgłoszenie zamykamy z notką,
#         że na `main` zmiana trafi przy wydaniu
#
#     Słowa kluczowe GitHuba same zamykają zgłoszenie dopiero przy merge do
#     gałęzi domyślnej, czyli `main`; PR-y solvera idą do `testing`, więc bez
#     tego zgłoszenia wisiałyby otwarte aż do wydania.
#
#  B. Samym numerem — `#78` gdzieś w tytule albo opisie, bez słowa
#     kluczowego. To luźniejszy związek: PR dotyka tematu, ale nikt nie
#     obiecuje, że go zamyka.
#       • PR otwarty → zgłoszenie dostaje "PR created"
#       • merge      → "PR created" znika, wchodzi "merged - is it ok?"
#     Zgłoszenia NIE zamykamy — ostatnie słowo ma człowiek, a etykieta jest
#     właśnie prośbą o sprawdzenie. Zdejmuje ją ten, kto zgłoszenie zamknie.
#
# Numer, który padł ze słowem kluczowym, nie liczy się drugi raz jako samo
# wspomnienie — ścieżka A wygrywa.
#
# PR zamknięty bez merge'a i PR cofnięty do wersji roboczej tylko zdejmują
# etykiety oczekiwania: zgłoszenie zostaje otwarte i znów czeka na kogoś.
# Etykiety są czystymi znacznikami stanu — żadna niczego nie uruchamia — i
# zgłoszenie nosi najwyżej jedną: nadanie etykiety zdejmuje wszystkie
# pozostałe, jakiekolwiek by nie były.
#
# Plik żyje na `main`: przy `pull_request_target` GitHub bierze workflow
# z gałęzi domyślnej repozytorium (GITHUB_REF wskazuje default branch),
# niezależnie od tego, do której gałęzi celuje PR. Za odsianie PR-ów
# odpowiada filtr `branches`, działający na gałęzi bazowej: etykiety
# obsługujemy dla PR-ów do `testing` i do `main`, a zgłoszenia zamykamy
# tylko przy `testing` — po merge do `main` robi to już sam GitHub.
on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
    branches: [testing, main]

# Kodu z PR-a nie pobieramy (żadnego checkoutu), więc `pull_request_target`
# jest tu bezpieczny. Tytuł i treść PR-a wchodzą do skryptu przez env,
# nigdy przez podstawienie ${{ }} w środku basha.
permissions:
  issues: write

env:
  LABEL_WAITING: "waiting for PR review"
  LABEL_MENTION: "PR created"
  LABEL_MERGED: "merged - is it ok?"

jobs:
  track-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Zbierz wskazane zgłoszenia
        id: refs
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Ścieżka A: słowa kluczowe w tytule i opisie plus nazwa gałęzi solvera.
          keyword_raw=$(
            {
              printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
                | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" \
                | grep -oE '^claude/issue-[0-9]+' \
                | grep -oE '[0-9]+' || true
            } | sort -u
          )

          # Ścieżka B: każde `#123`, z którego odejmujemy potem numery ze
          # ścieżki A i numer samego PR-a. `[^[:alnum:]/]` przed hashem odsiewa
          # odwołania do obcych repozytoriów (`org/repo#12`) i ogony URL-i.
          mention_all=$(
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
              | grep -oE '(^|[^[:alnum:]/])#[0-9]+' \
              | grep -oE '[0-9]+' | sort -u || true
          )
          mention_raw=""
          for n in $mention_all; do
            if [ "$n" = "$PR" ]; then
              continue
            fi
            if printf '%s\n' $keyword_raw | grep -qxF "$n"; then
              continue
            fi
            mention_raw="${mention_raw:+$mention_raw }$n"
          done

          # Numery, które nie są istniejącym zgłoszeniem, odsiewamy raz tutaj —
          # dalsze kroki dostają już gotowe listy. Stanu (otwarte / zamknięte)
          # celowo nie sprawdzamy: etykietę nadajemy tylko otwartym, ale
          # zdejmować ją trzeba także z zamkniętych.
          filter() {
            local out="" n json
            for n in "$@"; do
              if ! json=$(gh api "repos/$REPO/issues/$n" 2>/dev/null); then
                echo "#$n nie istnieje — pomijam." >&2
                continue
              fi
              if [ -n "$(printf '%s' "$json" | jq -r '.pull_request.url // empty')" ]; then
                echo "#$n to PR, nie zgłoszenie — pomijam." >&2
                continue
              fi
              out="${out:+$out }$n"
            done
            printf '%s' "$out"
          }

          keyword=$(filter $keyword_raw)
          mention=$(filter $mention_raw)

          echo "PR #$PR — ze słowem kluczowym: [${keyword:-brak}], samo wspomnienie: [${mention:-brak}]"
          {
            echo "keyword=$keyword"
            echo "mention=$mention"
          } >> "$GITHUB_OUTPUT"

      - name: Nadaj etykiety otwartym zgłoszeniom
        # Wersje robocze pomijamy — do recenzji zgłasza je dopiero
        # „Ready for review", które przychodzi tu osobnym zdarzeniem.
        #
        # `edited` jest w wyzwalaczach, bo numer zgłoszenia często dopisuje się
        # do opisu już po otwarciu PR-a. Odwrotny przypadek — ktoś usuwa `#78`
        # z opisu — zostawia na zgłoszeniu nieaktualną etykietę do ręcznego
        # zdjęcia; nie zgadujemy z historii edycji, co zniknęło.
        if: >-
          (steps.refs.outputs.keyword != '' || steps.refs.outputs.mention != '')
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && github.event.pull_request.draft == false
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          # Pierwszy bieg w repo zakłada etykiety; przy kolejnych `gh` zgłasza
          # „already exists" i to jest w porządku.
          gh label create "$LABEL_WAITING" --repo "$REPO" --color FBCA04 \
            --description "Jest PR, który to zamyka — czeka na recenzję" || true
          gh label create "$LABEL_MENTION" --repo "$REPO" --color C5DEF5 \
            --description "Jakiś PR o tym wspomina, bez deklaracji zamknięcia" || true

          oznacz() {
            local label="$1"; shift
            local n json state other
            local -a args
            for n in "$@"; do
              json=$(gh api "repos/$REPO/issues/$n")
              state=$(printf '%s' "$json" | jq -r .state)
              if [ "$state" != open ]; then
                echo "#$n nie jest otwarte (stan: $state) — nie etykietuję."
                continue
              fi

              # Nadawana etykieta zostaje jedyną — resztę zdejmujemy bez
              # patrzenia, co to jest. Listę bierzemy z samego zgłoszenia, bo
              # `--remove-label` na etykiecie, której ono nie ma, wywraca całe
              # wywołanie, a razem z nim nadanie nowej.
              args=(--add-label "$label")
              while IFS= read -r other; do
                [ -n "$other" ] || continue
                args+=(--remove-label "$other")
                echo "#$n: zdejmuję \"$other\"" | tee -a "$GITHUB_STEP_SUMMARY"
              done < <(printf '%s' "$json" | jq -r \
                --arg keep "$label" '.labels[].name | select(. != $keep)')

              gh issue edit "$n" --repo "$REPO" "${args[@]}"
              echo "#$n: etykieta \"$label\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          }

          [ -n "$KEYWORD" ] && oznacz "$LABEL_WAITING" $KEYWORD
          [ -n "$MENTION" ] && oznacz "$LABEL_MENTION" $MENTION
          exit 0

      - name: Zdejmij etykiety oczekiwania
        if: >-
          (steps.refs.outputs.keyword != '' || steps.refs.outputs.mention != '')
          && (github.event.action == 'closed'
              || github.event.action == 'converted_to_draft')
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          odznacz() {
            local label="$1"; shift
            local n
            for n in "$@"; do
              # Etykiety mogło nigdy nie być: zgłoszenie sprzed tego workflow,
              # PR otwarty od razu jako wersja robocza, etykieta zdjęta ręcznie.
              # Brak etykiety to nie awaria, więc nie wywracamy na tym biegu.
              if gh issue edit "$n" --repo "$REPO" --remove-label "$label"; then
                echo "#$n: zdjęto etykietę \"$label\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "#$n: nie udało się zdjąć etykiety \"$label\" — najpewniej jej nie miało."
              fi
            done
          }

          [ -n "$KEYWORD" ] && odznacz "$LABEL_WAITING" $KEYWORD
          [ -n "$MENTION" ] && odznacz "$LABEL_MENTION" $MENTION
          exit 0

      - name: Oznacz wspomniane zgłoszenia jako zmergowane
        # Ścieżka B kończy się pytaniem do człowieka, nie zamknięciem: etykieta
        # mówi „PR wszedł, sprawdź, czy to załatwia sprawę". Poprzednie etykiety
        # stanu — także te nadane przez inne PR-y — schodzą razem z nadaniem tej.
        if: >-
          steps.refs.outputs.mention != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
        env:
          MENTION: ${{ steps.refs.outputs.mention }}
        run: |
          set -euo pipefail

          gh label create "$LABEL_MERGED" --repo "$REPO" --color D4C5F9 \
            --description "Wspominający PR jest zmergowany — do sprawdzenia" || true

          for n in $MENTION; do
            json=$(gh api "repos/$REPO/issues/$n")
            state=$(printf '%s' "$json" | jq -r .state)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — nie etykietuję."
              continue
            fi

            args=(--add-label "$LABEL_MERGED")
            while IFS= read -r other; do
              [ -n "$other" ] || continue
              args+=(--remove-label "$other")
              echo "#$n: zdejmuję \"$other\"" | tee -a "$GITHUB_STEP_SUMMARY"
            done < <(printf '%s' "$json" | jq -r \
              --arg keep "$LABEL_MERGED" '.labels[].name | select(. != $keep)')

            gh issue edit "$n" --repo "$REPO" "${args[@]}"
            echo "#$n: etykieta \"$LABEL_MERGED\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Zamknij zgłoszenia zmergowane do testing
        if: >-
          steps.refs.outputs.keyword != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'testing'
        env:
          KEYWORD: ${{ steps.refs.outputs.keyword }}
        run: |
          set -euo pipefail

          for n in $KEYWORD; do
            state=$(gh api "repos/$REPO/issues/$n" --jq .state)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — pomijam."
              continue
            fi

            gh issue comment "$n" --repo "$REPO" --body \
              "Rozwiązane w #$PR. Zmiana jest na gałęzi \`testing\`; na \`main\` trafi przy najbliższym wydaniu."
            gh issue close "$n" --repo "$REPO" --reason completed

            echo "Zamknięto #$n (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
