name: "Zgłoszenia: etykieta oczekiwania i zamykanie po merge"

# Zgłoszenie wskazane przez PR słowem kluczowym (`Fixes #78` w tytule albo
# w opisie) przechodzi przez dwa stany i oba widać na liście zgłoszeń:
#
#  1. Jest PR, nie ma jeszcze merge'a → zgłoszenie dostaje etykietę
#     "waiting for PR review". Znaczy: ktoś to już napisał, rzecz czeka
#     na czyjąś recenzję, nie ma po co brać jej drugi raz.
#
#  2. PR zmergowany do `testing` → etykieta znika, a zgłoszenie zamyka się
#     z notką, że na `main` zmiana trafi przy wydaniu. Słowa kluczowe
#     GitHuba same zamykają zgłoszenie dopiero przy merge do gałęzi
#     domyślnej, czyli `main`; PR-y solvera idą do `testing`, więc bez tego
#     zgłoszenia wisiałyby otwarte aż do wydania.
#
#     PR zamknięty bez merge'a i PR cofnięty do wersji roboczej tylko
#     zdejmują etykietę — zgłoszenie zostaje otwarte i znów czeka na kogoś.
#
# Numery zgłoszeń zbieramy z tych samych dwóch źródeł co zawsze: słów
# kluczowych w tytule i opisie PR-a oraz z nazwy gałęzi solvera
# (`claude/issue-78-20260903-2030`). Etykieta jest czystym znacznikiem
# stanu — niczego nie uruchamia.
#
# Plik żyje na `main`: przy `pull_request_target` GitHub bierze workflow
# z gałęzi domyślnej repozytorium (GITHUB_REF wskazuje default branch),
# niezależnie od tego, do której gałęzi celuje PR. Za odsianie PR-ów
# odpowiada filtr `branches`, działający na gałęzi bazowej: etykietę
# obsługujemy dla PR-ów do `testing` i do `main`, a zgłoszenia zamykamy
# tylko przy `testing` — po merge do `main` robi to już sam GitHub.
on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
    branches: [testing, main]

# Kodu z PR-a nie pobieramy (żadnego checkoutu), więc `pull_request_target`
# jest tu bezpieczny. Tytuł i treść PR-a wchodzą do skryptu przez env,
# nigdy przez podstawienie ${{ }} w środku basha.
permissions:
  issues: write

env:
  LABEL: "waiting for PR review"

jobs:
  track-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Zbierz wskazane zgłoszenia
        id: refs
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          raw=$(
            {
              printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
                | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" \
                | grep -oE '^claude/issue-[0-9]+' \
                | grep -oE '[0-9]+' || true
            } | sort -u
          )

          # Odsiewamy tu raz numery, które nie są zgłoszeniem — dalsze kroki
          # dostają już samą listę istniejących zgłoszeń. Stanu (otwarte /
          # zamknięte) celowo nie sprawdzamy: etykietę nadajemy tylko otwartym,
          # ale zdejmować ją trzeba także z zamkniętych.
          numbers=""
          for n in $raw; do
            if ! json=$(gh api "repos/$REPO/issues/$n" 2>/dev/null); then
              echo "#$n nie istnieje — pomijam."
              continue
            fi
            if [ -n "$(printf '%s' "$json" | jq -r '.pull_request.url // empty')" ]; then
              echo "#$n to PR, nie zgłoszenie — pomijam."
              continue
            fi
            numbers="${numbers:+$numbers }$n"
          done

          if [ -z "$numbers" ]; then
            echo "PR #$PR nie wskazuje żadnego zgłoszenia." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PR #$PR wskazuje zgłoszenia: $numbers"
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Oznacz zgłoszenia jako czekające na recenzję
        # Wersje robocze pomijamy — do recenzji zgłasza je dopiero
        # „Ready for review", które przychodzi tu osobnym zdarzeniem.
        #
        # `edited` jest w wyzwalaczach, bo słowo kluczowe często dopisuje się
        # do opisu już po otwarciu PR-a. Odwrotny przypadek — ktoś usuwa
        # `Fixes #78` z opisu — zostawia na zgłoszeniu nieaktualną etykietę
        # do ręcznego zdjęcia; nie zgadujemy z historii edycji, co zniknęło.
        if: >-
          steps.refs.outputs.numbers != ''
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && github.event.pull_request.draft == false
        env:
          NUMBERS: ${{ steps.refs.outputs.numbers }}
        run: |
          set -euo pipefail

          # Pierwszy bieg w repo zakłada etykietę; przy kolejnych `gh` zgłasza
          # „already exists" i to jest w porządku.
          gh label create "$LABEL" --repo "$REPO" --color FBCA04 \
            --description "Jest PR do tego zgłoszenia, czeka na recenzję" || true

          for n in $NUMBERS; do
            state=$(gh api "repos/$REPO/issues/$n" --jq .state)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — nie etykietuję."
              continue
            fi
            gh issue edit "$n" --repo "$REPO" --add-label "$LABEL"
            echo "#$n: etykieta \"$LABEL\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Zdejmij etykietę oczekiwania
        if: >-
          steps.refs.outputs.numbers != ''
          && (github.event.action == 'closed'
              || github.event.action == 'converted_to_draft')
        env:
          NUMBERS: ${{ steps.refs.outputs.numbers }}
        run: |
          set -euo pipefail

          for n in $NUMBERS; do
            # Etykiety mogło nigdy nie być: zgłoszenie sprzed tego workflow,
            # PR otwarty od razu jako wersja robocza, etykieta zdjęta ręcznie.
            # Brak etykiety to nie awaria, więc nie wywracamy na tym biegu.
            if gh issue edit "$n" --repo "$REPO" --remove-label "$LABEL"; then
              echo "#$n: zdjęto etykietę \"$LABEL\" (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "#$n: nie udało się zdjąć etykiety \"$LABEL\" — najpewniej jej nie miało."
            fi
          done

      - name: Zamknij zgłoszenia zmergowane do testing
        if: >-
          steps.refs.outputs.numbers != ''
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'testing'
        env:
          NUMBERS: ${{ steps.refs.outputs.numbers }}
        run: |
          set -euo pipefail

          for n in $NUMBERS; do
            state=$(gh api "repos/$REPO/issues/$n" --jq .state)
            if [ "$state" != open ]; then
              echo "#$n nie jest otwarte (stan: $state) — pomijam."
              continue
            fi

            gh issue comment "$n" --repo "$REPO" --body \
              "Rozwiązane w #$PR. Zmiana jest na gałęzi \`testing\`; na \`main\` trafi przy najbliższym wydaniu."
            gh issue close "$n" --repo "$REPO" --reason completed

            echo "Zamknięto #$n (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
