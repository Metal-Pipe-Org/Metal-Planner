name: Claude - rozwiąż issue

# Odpala się, gdy ktoś z zespołu wspomni @claude — w treści nowego zgłoszenia
# albo w komentarzu pod nim. Claude czyta zgłoszenie wraz z dyskusją,
# wprowadza poprawkę, uruchamia testy i otwiera PR.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Jeden bieg na issue — kolejne wywołania czekają, zamiast deptać sobie po gałęzi.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  solve-issue:
    # Wstępne odsianie: wołanie @claude pod issue (nie pod PR-em) i nie od bota.
    # Uprawnień NIE sprawdzamy przez `author_association` — przy prywatnym
    # członkostwie w organizacji GitHub zwraca tam CONTRIBUTOR albo NONE nawet
    # dla osoby z prawem zapisu. Kto ma write, rozstrzyga sama akcja
    # (checkWritePermissions) i to ona odbija obcych.
    if: >-
      !github.event.issue.pull_request
      && contains(github.event.comment.body || github.event.issue.body || '', '@claude')
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: testing
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Zależności (żeby Claude mógł odpalić pytest)
        run: pip install -r requirements-dev.txt

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: testing
          track_progress: true
          prompt: |
            /solve-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}

            Zawołał Cię @${{ github.event.sender.login }}, wspominając @claude
            w wątku. Przeczytaj całą dyskusję: najświeższy wpis jest wiążący —
            jeśli doprecyzowuje albo zmienia treść zgłoszenia, trzymaj się jego.

            PR-a nie zakładaj sam. Wypchnij gałąź i podaj link „Create PR"
            z wypełnionym tytułem i opisem — otwiera go człowiek. Opis w tym
            linku (parametr `body`) ma się zaczynać od linijki
            `Closes #${{ github.event.issue.number }}`, dopiero pod nią opisz,
            co było źle i co zmieniasz. Bez słowa kluczowego GitHub nie wiąże
            PR-a ze zgłoszeniem: samo `#${{ github.event.issue.number }}` ani
            nagłówek `# ${{ github.event.issue.number }}` nie wystarczą.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(git:*),Bash(gh:*)'
