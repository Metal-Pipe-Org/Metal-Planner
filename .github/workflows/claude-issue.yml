name: Claude - rozwiąż issue

# Odpala się, gdy ktoś z zespołu wspomni @claude — w treści nowego zgłoszenia
# albo w komentarzu pod nim. Claude czyta zgłoszenie wraz z dyskusją,
# wprowadza poprawkę, uruchamia testy i otwiera PR.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Jeden bieg na issue — kolejne wywołania czekają, zamiast deptać sobie po gałęzi.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  solve-issue:
    # Wywołanie musi wołać @claude, dotyczyć issue (nie PR-a), pochodzić
    # od kogoś z zespołu i nie być wpisem samego bota.
    if: >-
      !github.event.issue.pull_request
      && contains(github.event.comment.body || github.event.issue.body || '', '@claude')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: testing
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Zależności (żeby Claude mógł odpalić pytest)
        run: pip install -r requirements-dev.txt

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: testing
          track_progress: true
          prompt: |
            /solve-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}

            Zawołał Cię @${{ github.event.sender.login }}, wspominając @claude
            w wątku. Przeczytaj całą dyskusję: najświeższy wpis jest wiążący —
            jeśli doprecyzowuje albo zmienia treść zgłoszenia, trzymaj się jego.
          claude_args: |
            --max-turns 40
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(git:*),Bash(gh:*)'
