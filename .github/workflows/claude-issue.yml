name: Claude - rozwiąż issue

# Odpala się, gdy ktoś z zespołu wspomni @claude — w treści nowego zgłoszenia
# albo w komentarzu pod nim. Claude czyta zgłoszenie wraz z dyskusją, wprowadza
# poprawkę, uruchamia testy i dokłada ją do gałęzi tego zgłoszenia. Zgłoszenia,
# którymi się zajmował, oznacza etykietą "claude" — to sam znacznik, etykieta
# niczego nie uruchamia.
#
# Cała praca z jednego zgłoszenia ląduje na jednej gałęzi `claude/issue-<numer>`.
# Claude pracuje na tymczasowej gałęzi roboczej, którą zakładamy sami: odciętej
# od gałęzi zgłoszenia, jeśli już jest, żeby zastał dotychczasową pracę, a po
# biegu przewijamy gałąź zgłoszenia na to, co wyszło. Gałąź robocza jest
# tymczasowa i znika przy następnym biegu.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  # Tania bramka. Warunek `if` odsiewa bez uruchamiania runnera; sam job dokłada
  # to, czego w wyrażeniach GitHuba nie da się zrobić — odróżnienie prawdziwego
  # wołania od @claude przepisanego w cytacie.
  gate:
    # Wstępne odsianie: wołanie @claude pod zgłoszeniem (nie pod PR-em) i nie
    # od bota. Uprawnień NIE sprawdzamy przez `author_association` — przy
    # prywatnym członkostwie w organizacji GitHub zwraca tam CONTRIBUTOR albo
    # NONE nawet dla osoby z prawem zapisu. Kto ma write, rozstrzyga pytanie
    # o uprawnienia wprost w kroku niżej, a nie dopiero akcja: zapowiedź pracy
    # wstawiamy przed nią, więc obcy nie może dostać pod zgłoszeniem komentarza
    # ani odpalić runnera z sekretami.
    if: >-
      !github.event.issue.pull_request
      && github.event.sender.type != 'Bot'
      && contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      # Skrypt z `main` — tak samo w claude-review-pr.yml i issue-triage.yml.
      - name: Pobierz sprawdzenia z main
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Sprawdź wołanie i uprawnienia
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WHO: ${{ github.event.sender.login }}
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          source .github/scripts/guard.sh
          gate_claude_call "$BODY" "$WHO"

  solve-issue:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # Jeden bieg na zgłoszenie. `cancel-in-progress` sprawia, że dwa wołania pod
    # rząd nie mielą się równolegle na dwóch gałęziach — nowsze ubija starsze.
    # Realizuje przy okazji zasadę „najświeższy wpis jest wiążący" z promptu.
    # Na poziomie joba, nie workflow: każdy komentarz pod zgłoszeniem tworzy
    # bieg, a grupa na poziomie workflow sprawiłaby, że wpis bez @claude ubija
    # trwającą pracę, zanim bramka zdąży go odsiać.
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Ustal gałąź bazową i posprzątaj gałęzie robocze
        id: base
        run: |
          ISSUE_BRANCH="claude/issue-${N}"
          echo "issue_branch=$ISSUE_BRANCH" >> "$GITHUB_OUTPUT"

          if ! git ls-remote --exit-code --heads origin "$ISSUE_BRANCH" >/dev/null 2>&1; then
            echo "Brak gałęzi $ISSUE_BRANCH — pierwszy bieg dla tego zgłoszenia."
            echo "branch=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Gałąź zgłoszenia już jest — odgałęziamy się od niej, żeby Claude
          # zastał w drzewie dotychczasową pracę i ją poprawiał, zamiast
          # zaczynać od `main` i pisać wszystko od nowa.
          echo "Kontynuacja pracy na $ISSUE_BRANCH."
          echo "branch=$ISSUE_BRANCH" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "+refs/heads/${ISSUE_BRANCH}:refs/remotes/origin/${ISSUE_BRANCH}"

          # Gałąź robocza z poprzedniego biegu zostaje celowo, żeby link
          # „View branch" w tamtym komentarzu nie umarł od razu. Kasujemy ją
          # dopiero teraz i tylko wtedy, gdy jej treść jest już w gałęzi
          # zgłoszenia — niedokończona praca z ubitego biegu zostaje do
          # ręcznej decyzji.
          git ls-remote --heads origin \
            | awk '{print $2}' | sed 's|refs/heads/||' | grep "^${ISSUE_BRANCH}-" \
          | while read -r B; do
              git fetch --no-tags origin "+refs/heads/${B}:refs/remotes/origin/${B}" || continue
              if git merge-base --is-ancestor "origin/${B}" "origin/${ISSUE_BRANCH}"; then
                echo "Kasuję zbędną gałąź roboczą: $B"
                git push origin --delete "$B" || true
              else
                echo "Zostawiam $B — ma commity spoza $ISSUE_BRANCH."
              fi
            done

      - name: Załóż gałąź roboczą
        id: work
        env:
          BASE: ${{ steps.base.outputs.branch }}
        run: |
          # Bez `track_progress` akcja pracuje w trybie agenta, który sam gałęzi
          # nie zakłada (tryb ze śledzeniem to robił) — Claude dostaje więc
          # gałąź od nas, odciętą od gałęzi zgłoszenia albo od `main`.
          # Przedrostek `claude/issue-N-` jest tym, po czym sprzątają
          # gałęzie robocze kroki wyżej i niżej.
          TMP="claude/issue-${N}-run${GITHUB_RUN_ID}"
          git checkout -b "$TMP" "origin/$BASE"
          echo "branch=$TMP" >> "$GITHUB_OUTPUT"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Zależności (żeby Claude mógł odpalić pytest)
        run: pip install -r requirements-dev.txt

      - name: Pobierz skrypty pomocnicze z main
        # Z `main`, nie z drzewa roboczego: tam leży praca Claude'a, a skrypt
        # wysyłki dostaje w env sekret webhooka.
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Wyłącz pliki pomocnicze z commitów
        run: |
          echo ".claude-answer.md" >> .git/info/exclude
          echo ".discord/" >> .git/info/exclude

      - name: Zapowiedz pracę w komentarzu
        id: hello
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Własna jednolinijkowa notka zamiast komentarza postępu akcji:
          # dłuższego nie da się skrócić, a ten i tak zwijamy na końcu.
          res=$(gh api "repos/$REPO/issues/$N/comments" \
            -f body="🤔 Claude pracuje nad tym zgłoszeniem ([podgląd biegu](${RUN}))." \
            --jq '[.html_url, .node_id] | @tsv')
          echo "node=${res##*$'\t'}" >> "$GITHUB_OUTPUT"

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /solve-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}

            Zawołał Cię @${{ github.event.sender.login }} w wątku zgłoszenia.
            Przeczytaj całą dyskusję: najświeższy wpis jest wiążący — jeśli
            doprecyzowuje albo zmienia treść zgłoszenia, trzymaj się jego.

            Gałąź, na której pracujesz (`${{ steps.work.outputs.branch }}`), jest
            tymczasowa. Trwałą gałęzią tego
            zgłoszenia jest `claude/issue-${{ github.event.issue.number }}`
            i workflow przeniesie tam Twoje commity, gdy skończysz. Jeśli
            zastajesz w drzewie roboczym poprawki dotyczące tego zgłoszenia, to
            Twoja własna praca z wcześniejszego wpisu w tym wątku — dopracuj ją
            zgodnie z najnowszym komentarzem, zamiast pisać wszystko od nowa.

            Nie zakładaj PR-a — nie masz do tego gałęzi docelowej. Twoje wyjście
            to commity na bieżącej gałęzi (wypchnij ją) i odpowiedź zapisana do
            pliku ${{ github.workspace }}/.claude-answer.md: co było źle i co
            zmieniłeś. Pod zgłoszeniem wstawi ją workflow, razem z linkiem do
            PR-a; nie pisz własnych komentarzy i nie commituj tego pliku.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(git:*),Bash(gh:*)'

      - name: Przenieś pracę na gałąź zgłoszenia
        id: ff
        if: always() && steps.work.outcome == 'success'
        env:
          TMP: ${{ steps.work.outputs.branch }}
          ISSUE_BRANCH: ${{ steps.base.outputs.issue_branch }}
        run: |
          # Bieg bez commitów: Claude nic nie wypchnął, więc gałęzi roboczej
          # na serwerze nie ma i nie ma czego przenosić. Sprawdzamy to osobnym `ls-remote`,
          # żeby awaria samego `fetch` (sieć, uprawnienia) wywaliła krok,
          # zamiast zostać wzięta za „nie było zmian".
          if ! git ls-remote --exit-code --heads origin "$TMP" >/dev/null 2>&1; then
            echo "Gałąź $TMP nie istnieje — ten bieg nie zmienił kodu."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${TMP}:refs/remotes/origin/${TMP}"

          # Bez --force: gałąź robocza została odcięta od $ISSUE_BRANCH na
          # starcie tego biegu, więc to zawsze fast-forward. Gdyby ktoś
          # w międzyczasie pushnął na $ISSUE_BRANCH, push się wywali i lepiej,
          # żeby to było widać.
          echo "Fast-forward $ISSUE_BRANCH <- $TMP"
          git push origin "refs/remotes/origin/${TMP}:refs/heads/${ISSUE_BRANCH}"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Ustal link do PR-a dla odpowiedzi
        id: link
        # Tylko gdy ten bieg coś wypchnął: bez zmian gałąź zgłoszenia może
        # jeszcze nie istnieć, a link do porównania z nią byłby martwy. Błąd
        # `gh` nie może zabić odpowiedzi, która i tak ma wyjść — bez linku.
        if: ${{ !cancelled() && steps.ff.outputs.moved == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BRANCH: ${{ steps.base.outputs.issue_branch }}
        run: |
          # Link dokleja do odpowiedzi workflow, bo to on zna gałąź docelową;
          # `body` z `Closes #N` jest tu pewne, nie zależy od tego, czy model
          # pamiętał o słowie kluczowym. Gdy PR już jest, nowy link byłby
          # mylący.
          PR=$(gh pr list --repo "$REPO" --head "$ISSUE_BRANCH" --state open \
                 --json number -q '.[0].number')
          if [ -n "$PR" ]; then
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://github.com/${REPO}/compare/main...${ISSUE_BRANCH}?expand=1&body=Closes+%23${N}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wstaw odpowiedź i zwiń zapowiedź
        id: answer
        # Odpowiedź idzie nowym komentarzem, bo tylko nowy powiadamia, i
        # dopiero potem zwijamy zapowiedź (odwracalnie, nic nie kasujemy).
        # Bieg ubity przez nowsze wołanie milczy: zaraz odezwie się tamten.
        if: ${{ !cancelled() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHO: ${{ github.event.sender.login }}
          OUTCOME: ${{ steps.claude.outcome }}
          NODE: ${{ steps.hello.outputs.node }}
          PR: ${{ steps.link.outputs.pr }}
          PR_URL: ${{ steps.link.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ANSWER=.claude-answer.md

          # Także przy porażce: Claude mógł zdążyć wypchnąć użyteczne commity,
          # a bez linku wołający musiałby sam szukać gałęzi zgłoszenia.
          pr_line() {
            if [ -n "$PR" ]; then
              echo "PR #$PR już istnieje i sam się zaktualizuje."
              echo
            elif [ -n "$PR_URL" ]; then
              echo "[Otwórz PR do \`main\`]($PR_URL)"
              echo
            fi
          }

          if [ "$OUTCOME" != success ]; then
            {
              echo "⚪ Claude nie dokończył — [log biegu]($RUN)."
              echo
              pr_line
              echo "@$WHO"
            } > "$RUNNER_TEMP/answer.md"
          elif [ -s "$ANSWER" ]; then
            {
              cat "$ANSWER"
              echo
              pr_line
              echo "@$WHO"
            } > "$RUNNER_TEMP/answer.md"
          else
            # Bez odpowiedzi zapowiedź zostaje: to jedyny ślad biegu.
            echo "Claude nie zostawił odpowiedzi — nic nie wstawiam."
            exit 0
          fi

          url=$(gh issue comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/answer.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

          source .discord/.github/scripts/guard.sh
          minimize_comment "$NODE" \
            || echo "::warning::Nie udało się zwinąć zapowiedzi."

      - name: Zwiń zapowiedź ubitego biegu
        # Nowsze wołanie ubiło ten bieg, więc odpowiedzi nie będzie — zapowiedź
        # „Claude pracuje" nie może zostać wisieć. Odpowie tamten bieg.
        if: ${{ cancelled() && steps.hello.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE: ${{ steps.hello.outputs.node }}
        run: |
          source .discord/.github/scripts/guard.sh
          minimize_comment "$NODE"

      - name: Oznacz zgłoszenie etykietą "claude"
        # Sam znacznik „Claude się tym zajmował" — nic nie uruchamia.
        # Warunek na krok `claude`, a nie `always()`: gdy wołający nie ma prawa
        # zapisu, bramka go odbija i zgłoszenie ma wtedy zostać nieoznaczone.
        # Późniejsza awaria (np. nieudany fast-forward) etykiety już nie cofa.
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create claude --repo "$REPO" \
            --color BFD4F2 --description "Obsługiwane przez Claude" || true
          gh issue edit "$N" --repo "$REPO" --add-label claude

      - name: Daj znać wołającemu na Discordzie
        # Claude pisze pod zgłoszeniem jako bot, a wpisy botów discord.yml
        # pomija (jego komentarz postępu i tak dojrzewa edycjami, które nikogo
        # nie powiadamiają). To jedyna wiadomość o końcu pracy — bez niej
        # wołający musiałby sam zaglądać, czy Claude już skończył. Bieg ubity
        # przez nowsze wołanie milczy: zaraz odezwie się tamten.
        if: ${{ !cancelled() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        continue-on-error: true
        env:
          WHO: ${{ github.event.sender.login }}
          TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ steps.answer.outputs.url || github.event.issue.html_url }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh

          if [ "$OUTCOME" != success ]; then
            discord_send grey "" "Claude nie dokończył: #$N $TITLE" "$RUN" \
              "@$WHO, link prowadzi do logu biegu"
          else
            discord_send info "" "Claude skończył: #$N $TITLE" "$ISSUE_URL" \
              "@$WHO, odpowiedź czeka pod zgłoszeniem — PR założysz stamtąd"
          fi
