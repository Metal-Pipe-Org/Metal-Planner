name: Claude - oceń PR

# Każdy nowo otwarty pull request dostaje ocenę: werdykt, podsumowanie zmian,
# analiza kodu i rzeczy do przemyślenia. Zaraz po otwarciu PR-a pod nim ląduje
# krótka zapowiedź, że Claude go czyta, a gotowa ocena — albo informacja, że
# się nie udała — przychodzi osobnym, nowym komentarzem. Żadnego komentarza nie
# edytujemy po fakcie: edycja nie wysyła nikomu powiadomienia, więc autor PR-a
# nie miał jak się dowiedzieć, że ocena już jest, i trzeba go było szturchać
# ręcznie. Nowy komentarz z @wzmianką autora powiadamia go na GitHubie, a ta
# sama wiadomość leci na Discorda, gdzie zespół faktycznie śledzi repo. Gdy
# ocena już stoi, zapowiedź zwijamy (nie kasujemy), żeby nie zalegała.
#
# Recenzentów ten workflow nie woła. Autor czyta ocenę i dopiero gdy uzna PR za
# gotowy, prosi o recenzję w panelu bocznym („Reviewers"); ping na Discordzie
# wysyła wtedy `discord.yml`.
#
# Ocena jest do przeczytania przez człowieka. Claude nie wystawia recenzji
# GitHuba, nie zatwierdza, nie blokuje i nie merguje. `Write` dostaje wyłącznie
# po to, żeby zapisać ocenę do `.claude-review.md` — zapis ląduje w drzewie na
# maszynie biegu i ginie razem z nią, do ocenianego PR-a nie trafia.
#
# Testów nie uruchamiamy: zestaw nie jest jeszcze właściwie skonfigurowany
# (stąd `tests.yml` odpalany wyłącznie ręcznie), więc jego wynik niczego by nie
# rozstrzygnął, a łatwo byłoby na jego podstawie postawić PR-owi fałszywy
# zarzut. Dlatego nie ma tu ani Pythona, ani zależności, a Claude nie dostaje
# `Bash(pytest:*)`. Gdy testy będą gotowe, wraca setup-python, `pip install
# -r requirements-dev.txt`, pytest w allowedTools i sekcja 2 instrukcji.
#
# Czego Claude ma szukać i jak ma wyglądać sam komentarz — sekcje, skala
# emotikonów werdyktu, długość — siedzi w `.claude/commands/review-pr.md`
# (sekcja „4. Zapisz ocenę" to gotowy szablon treści). Ten plik odpowiada tylko
# za to, KIEDY ocena leci i gdzie ląduje; żeby zmienić JEJ KSZTAŁT, nie ruszaj
# workflow, tylko tamten plik.
#
# Ocena leci raz, przy otwarciu (albo przy wyjściu z wersji roboczej), żeby
# dosyłanie commitów nie sypało kolejnymi ocenami pod ten sam PR. Push do PR-a
# (`synchronize`) też tu wpada, ale ocenia tylko PR, pod którym nie ma jeszcze
# żadnej zapowiedzi. To łata na konflikt: PR otwarty w konflikcie z bazą nie ma
# commitu scalenia, więc GitHub w ogóle nie tworzy biegu `pull_request` — ani
# udanego, ani pominiętego — i ocena przepadała po cichu. Teraz przychodzi
# z pierwszym pushem, który konflikt usuwa. Po większych poprawkach albo gdy
# ocena się nie udała, wystarczy napisać `@claude` w komentarzu pod PR-em —
# workflow sam weźmie numer z wątku. Awaryjnie zostaje też ręczny bieg:
# Actions -> „Claude - oceń PR" -> Run workflow -> numer PR-a (tylko tam jest
# przełącznik debug).
#
# Do zwykłych PR-ów wystarcza kopia na `main` i oba wyzwalacze biorą ją
# stamtąd: `pull_request` czyta workflow z commitu scalenia PR-a z gałęzią
# bazową (a bazą jest `main`), `workflow_dispatch` — z gałęzi domyślnej
# (znów `main`). Działa to również dla gałęzi odbitych, zanim ocena powstała:
# commit scalenia dokłada plik z bazy, choć sama gałąź go nie ma.
#
# Kopia na `stable` jest tylko po to, żeby ocenę dostawały PR-y wydaniowe
# `main` -> `stable`: ich bazą jest `stable`, więc `pull_request` szuka pliku
# tam. Utrzymuje się sama — wjeżdża na `stable` z każdym wydaniem, więc
# nie edytuj jej osobno, bo wydanie skończy się konfliktem.
#
# Wołanie `@claude` przychodzi zdarzeniem `issue_comment`, które GitHub czyta
# zawsze z gałęzi domyślnej — dla niego liczy się wyłącznie kopia na `main`,
# także przy PR-ach wydaniowych do `stable`.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # Bazy, których ocena dotyczy: zwykłe PR-y do `main` i PR-y wydaniowe
    # `main` -> `stable`. PR-y o innej bazie zostawiamy bez komentarza.
    branches: [main, stable]
  # Komentarz z `@claude` w dyskusji pod PR-em powtarza ocenę. Wołania spod
  # zwykłych zgłoszeń obsługuje claude-issue.yml — tu odsiewa je bramka.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Numer PR-a do ponownej oceny"
        required: true
      debug:
        description: "Wypisz pełną rozmowę Claude'a w logu (log jest publiczny!)"
        type: boolean
        default: false

jobs:
  # Bramka tylko dla wołań z komentarza. `issue_comment` tworzy bieg przy
  # każdym komentarzu w repo, więc warunek `if` odsiewa bez runnera wszystko,
  # co nie jest `@claude` pod PR-em, a job dokłada to, czego w wyrażeniach nie
  # da się zrobić: odrzucenie `@claude` z cytatu i sprawdzenie uprawnień.
  gate:
    if: >-
      github.repository == 'Metal-Pipe-Org/Metal-Planner'
      && github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.sender.type != 'Bot'
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      # Skrypt z `main` — tak samo w claude-issue.yml i issue-triage.yml.
      - name: Pobierz sprawdzenia z main
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Ocena idzie na sekretach i pobiera kod PR-a, więc wołać może tylko
      # ktoś z prawem zapisu — tak jak ręczny bieg, który też wymaga zapisu.
      - name: Sprawdź wołanie i uprawnienia
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          WHO: ${{ github.event.sender.login }}
        run: |
          source .github/scripts/guard.sh
          gate_claude_call "$BODY" "$WHO"

  review:
    needs: gate
    # `!cancelled()` jest potrzebne, bo przy `pull_request` i ręcznym biegu
    # bramka jest pominięta, a pominięty `needs` domyślnie pomija i ten job.
    #
    # Wersje robocze pomijamy — do oceny zgłasza je dopiero „Ready for review",
    # które przychodzi tu osobnym zdarzeniem. Wołanie `@claude` działa także
    # pod wersją roboczą: ktoś wprost o ocenę poprosił.
    #
    # PR-y z forków odsiewamy, bo przy `pull_request` z obcego repozytorium
    # GitHub nie daje sekretów (nie byłoby czym uwierzytelnić Claude'a), a sam
    # wyzwalacz `pull_request_target` odpada: pobieramy tu kod z PR-a.
    #
    # Nazwa repozytorium wpisana na sztywno: forki kopiują workflow razem
    # z kodem, a ocena ma chodzić tylko tutaj, nie w cudzych kopiach.
    if: >-
      !cancelled()
      && github.repository == 'Metal-Pipe-Org/Metal-Planner'
      && (github.event_name == 'workflow_dispatch'
          || needs.gate.outputs.go == 'true'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.draft == false
              && github.event.pull_request.head.repo.full_name == github.repository))
    # Jedna ocena na PR. Nowsze wołanie ubija starsze, żeby pod PR-em nie
    # wylądowały dwie oceny naraz. Na poziomie joba, nie workflow:
    # każdy komentarz pod PR-em tworzy bieg, a grupa na poziomie workflow
    # sprawiłaby, że zwykłe „dzięki" ubija trwającą ocenę, zanim bramka
    # zdąży je odsiać.
    #
    # Push do PR-a niczego nie ubija, tylko czeka w kolejce. Inaczej push
    # zaraz po otwarciu przerwałby pierwszą ocenę, a sam, widząc już jej
    # zapowiedź, zszedłby z drogi — i PR zostałby bez oceny.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
      cancel-in-progress: ${{ github.event.action != 'synchronize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Ustal PR do oceny
        id: pr
        env:
          N: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Komentarz i ręczny bieg dają sam numer, więc czubek i gałąź bazową
          # dociągamy z API — dla obu ścieżek dalej wygląda to tak samo.
          json=$(gh api "repos/$REPO/pulls/$N")
          head_sha=$(printf '%s' "$json" | jq -r .head.sha)
          base_ref=$(printf '%s' "$json" | jq -r .base.ref)
          state=$(printf '%s' "$json" | jq -r .state)
          head_repo=$(printf '%s' "$json" | jq -r '.head.repo.full_name // ""')

          if [ "$state" != open ]; then
            echo "PR #$N nie jest otwarty (stan: $state) — nie oceniam." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Oceniamy wyłącznie PR-y z gałęzi tego repozytorium. Przy
          # `pull_request` forki odsiewa już warunek joba, ale `issue_comment`
          # i ręczny bieg dostają pełne sekrety bez względu na pochodzenie
          # PR-a. Obcy kod (i ewentualny prompt injection w nim albo w opisie)
          # nie może trafić do Claude'a z tokenami w zasięgu tylko dlatego, że
          # ktoś z zespołu napisał pod nim `@claude` albo odpalił bieg ręcznie.
          # Skasowany fork daje pusty `head.repo` i też tu odpada.
          if [ "$head_repo" != "$REPO" ]; then
            msg="PR #$N pochodzi z forka (${head_repo:-skasowane repozytorium}) — nie oceniam."
            echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
              gh pr comment "$N" --repo "$REPO" --body \
                "⚪ Nie oceniam PR-ów z forków — ich kod nie może trafić do Claude'a razem z sekretami repozytorium." \
                || true
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push ocenia tylko PR, który oceny jeszcze nie dostał (patrz
          # nagłówek). Znakiem jest zapowiedź z kroku niżej albo informacja
          # o zmienionym workflow spod tego kroku — obie leżą pod PR-em także
          # wtedy, gdy oceny nie było, a ponowienie to już sprawa `@claude`,
          # nie każdego kolejnego pusha.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
              && [ "$ACTION" = synchronize ]; then
            hello=$(gh api --paginate "repos/$REPO/issues/$N/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("🤔 Claude czyta ten PR") or startswith("⚪ Ten PR zmienia workflow oceny"))) | .id')
            if [ -n "$hello" ]; then
              echo "PR #$N ma już ocenę — push jej nie powtarza." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Akcja Claude'a działa tylko z workflow identycznym jak na gałęzi
          # domyślnej (zabezpieczenie: PR nie podmieni workflow, żeby dobrać
          # się do jej tokenów). Przy `pull_request` workflow pochodzi z PR-a,
          # więc PR, który zmienia ten plik, akcja pomija — i kończy się na
          # zielono, z samym ostrzeżeniem w logu. Zamiast pustej „porażki”
          # mówimy od razu, co się dzieje: `@claude` bierze workflow z `main`
          # i działa.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            wf=${GITHUB_WORKFLOW_REF#*/*/}
            wf=${wf%@*}
            if gh api --paginate "repos/$REPO/pulls/$N/files" --jq '.[].filename' \
                | grep -qxF "$wf"; then
              author=$(printf '%s' "$json" | jq -r .user.login)
              url=$(gh pr comment "$N" --repo "$REPO" --body \
                "⚪ Ten PR zmienia workflow oceny, więc Claude nie oceni go przy otwarciu — akcja Claude'a działa tylko z workflow takim jak na \`main\`. Napisz w komentarzu \`@claude\`: wołanie bierze workflow z \`main\` i ocena ruszy.

          @$author")
              echo "PR #$N zmienia $wf — zamiast oceny informacja: $url" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              # Dane dla pingu na Discordzie, jak przy zwykłej ocenie.
              {
                echo "go=false"
                echo "number=$N"
                echo "kind=workflow"
                echo "url=$url"
                echo "author=$author"
                echo "title=$(printf '%s' "$json" | jq -r .title)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          {
            echo "go=true"
            echo "number=$N"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout czubka PR-a
        if: steps.pr.outputs.go == 'true'
        uses: actions/checkout@v6
        with:
          # Konkretny commit, a nie `refs/pull/N/merge`: ocena ma dotyczyć tego,
          # co autor faktycznie wypchnął. Pełna historia, żeby dało się porównać
          # z gałęzią bazową.
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Pobierz skrypty pomocnicze z main
        # Z `main`, nie z drzewa PR-a: skrypt wysyłki dostaje w env sekret
        # webhooka, a ocenianemu kodowi go nie dajemy.
        if: steps.pr.outputs.go == 'true' || steps.pr.outputs.url != ''
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Weź instrukcję oceny z gałęzi bazowej
        if: steps.pr.outputs.go == 'true'
        env:
          BASE: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail

          # W drzewie mamy czubek PR-a, a więc razem z ocenianym kodem także
          # jego wersję `.claude/` — z instrukcją, która mówi Claude'owi, jak
          # ma oceniać, i z ustawieniami, które Claude Code wykonuje. To zły
          # plik do słuchania: PR odgałęziony przed wprowadzeniem oceny w ogóle
          # go nie ma, a PR, który go zmienia, przepisywałby sobie własną
          # recenzję. Instrukcja ma pochodzić z gałęzi bazowej, nie z PR-a —
          # oceniany jest kod, nie to, co PR mówi o sobie samym.
          CMD=.claude/commands/review-pr.md
          cp "$CMD" "$RUNNER_TEMP/review-pr.md" 2>/dev/null || true

          # Ocena czytana po biegu ma pochodzić od Claude'a, a nie leżeć
          # w PR-ze gotowa, zanim Claude w ogóle zacznie.
          rm -rf .claude CLAUDE.md .claude-review.md
          for path in .claude CLAUDE.md; do
            if git cat-file -e "origin/$BASE:$path" 2>/dev/null; then
              git checkout "origin/$BASE" -- "$path"
              echo "Wzięte z origin/$BASE: $path"
            fi
          done

          if [ -f "$CMD" ]; then
            exit 0
          fi

          # Pierwszy taki PR: instrukcja dopiero nim wchodzi, na bazie jej
          # jeszcze nie ma. Później ta gałąź już nie jest używana.
          if [ -f "$RUNNER_TEMP/review-pr.md" ]; then
            mkdir -p "$(dirname "$CMD")"
            cp "$RUNNER_TEMP/review-pr.md" "$CMD"
            echo "Na origin/$BASE nie ma jeszcze $CMD — biorę wersję z tego PR-a."
          else
            echo "Nie ma $CMD ani na origin/$BASE, ani w tym PR-rze." >&2
            exit 1
          fi

      - name: Zapowiedz ocenę w komentarzu
        id: hello
        if: steps.pr.outputs.go == 'true'
        env:
          N: ${{ steps.pr.outputs.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Jedna krótka linijka. Jej początek jest znakiem „ocena już była"
          # dla pushy (krok „Ustal PR do oceny"), a zwinięty komentarz API
          # dalej zwraca, więc znak działa także po zwinięciu.
          res=$(gh api "repos/$REPO/issues/$N/comments" \
            -f body="🤔 Claude czyta ten PR ([podgląd biegu](${RUN}))." \
            --jq '[.html_url, .node_id] | @tsv')
          echo "Zapowiedź: ${res%%$'\t'*}"
          echo "node=${res##*$'\t'}" >> "$GITHUB_OUTPUT"

      - name: Claude
        id: claude
        if: steps.pr.outputs.go == 'true'
        # Własny limit, niższy niż 25 minut całego joba. Przekroczenie limitu
        # joba GitHub traktuje jak ubicie biegu, a ubity bieg celowo milczy —
        # autor zostałby z samą zapowiedzią. Przekroczenie limitu kroku to
        # zwykła porażka, więc niżej idzie informacja o niej z pingiem, a zapas
        # do 25 minut wystarcza na jej wstawienie.
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Normalnie action pokazuje w logu tylko wynik, bez rozmowy i bez
          # tego, co Claude wyczytał z repo — i tak ma zostać, bo log biegu
          # w publicznym repozytorium czyta każdy. Przełącznik jest po to,
          # żeby przy ręcznym powtórzeniu dało się zobaczyć, na co poszły tury
          # i które wywołania odbiła lista `--allowedTools`.
          show_full_output: ${{ github.event.inputs.debug == 'true' }}
          prompt: |
            /review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ steps.pr.outputs.number }} REVIEW_FILE: ${{ github.workspace }}/.claude-review.md

            PR celuje w gałąź `${{ steps.pr.outputs.base_ref }}`; w drzewie masz
            jego czubek (${{ steps.pr.outputs.head_sha }}), więc zmianę zobaczysz
            przez `git diff origin/${{ steps.pr.outputs.base_ref }}...HEAD`.

            Twoje jedyne wyjście to gotowa ocena zapisana do pliku
            ${{ github.workspace }}/.claude-review.md — pod PR-em wstawi ją workflow.
            Nie pisz żadnych komentarzy, nie wystawiaj recenzji GitHuba i nie
            ruszaj kodu.
          # Limit tur musi mieć zapas na to, czego instrukcja wymaga: opis PR-a,
          # diff, komentarze, `README.md`, `docs/` i CAŁE pliki wokół zmienionych
          # linii — a `planner.py` czy `static/app.js` mają po kilka tysięcy
          # linii, więc każdy z nich to kilka odczytów. Przy trzydziestu turach
          # ocena PR-a na dwanaście plików padła na `error_max_turns`, zanim
          # zdążyła cokolwiek napisać. Prawdziwym bezpiecznikiem jest
          # `timeout-minutes` tego kroku; tura trwa tu kilka sekund, więc sto tur
          # spokojnie się w nim mieści.
          #
          # Plik z oceną leży w drzewie roboczym, bo poza nim Claude Code nie
          # pisze, a zapisu przez `cat >` nie przepuszcza lista narzędzi — przy
          # samym odczycie ocena szła donikąd i każdy bieg kończył się
          # „Ocena się nie udała". `Write` nie daje dostępu do repo: drzewo
          # ginie razem z maszyną, a token ma do kodu tylko odczyt.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools 'Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(cat:*),Bash(ls:*),Write'

      - name: Wstaw ocenę albo informację o porażce
        id: post
        # Autor ma dostać odpowiedź bez względu na wynik biegu. Bieg mógł paść
        # albo wyczerpać limit tur — wtedy zamiast oceny idzie uczciwa
        # informacja z linkiem do logu, inaczej zostałaby sama zapowiedź i autor
        # czekałby na próżno. Oba warianty to nowy komentarz z @wzmianką
        # autora, bo tylko nowy komentarz powiadamia. Bieg ubity przez nowszy
        # milczy, jak w claude-issue.yml: zaraz odezwie się tamten, a fałszywa
        # porażka z pingiem tuż przed prawdziwą oceną tylko by myliła.
        if: ${{ !cancelled() && steps.hello.outcome == 'success' }}
        env:
          N: ${{ steps.pr.outputs.number }}
          REVIEW: ${{ github.workspace }}/.claude-review.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail

          json=$(gh api "repos/$REPO/pulls/$N")
          author=$(printf '%s' "$json" | jq -r .user.login)
          title=$(printf '%s' "$json" | jq -r .title)

          if [ -s "$REVIEW" ]; then
            {
              cat "$REVIEW"
              echo
              echo '---'
              echo
              echo "@$author — ocena gotowa. Gdy uznasz, że PR nadaje się do recenzji, poproś o nią w panelu bocznym (Reviewers); recenzent dostanie wtedy ping także na Discordzie."
            } > "$RUNNER_TEMP/post.md"
            kind=review
            verdict=$(grep -m1 '^## ' "$REVIEW" | sed 's/^## *//' || true)
          else
            # Przyczynę bierzemy z zapisu rozmowy, który action zostawia na
            # runnerze także przy porażce. Patrzymy wyłącznie na końcowy wynik
            # i na błędy API, nie na całą rozmowę — w przeczytanym kodzie też
            # może paść „rate limit", a to nie znaczy, że limit się skończył.
            exec_file=${EXEC:-$RUNNER_TEMP/claude-execution-output.json}
            reason=""
            if [ -f "$exec_file" ]; then
              reason=$(jq -r '
                  (.[]? | select(.type == "result" and .is_error == true) | .result // empty),
                  (.[]? | select(.type == "assistant" and .error != null) | .error)
                ' "$exec_file" 2>/dev/null | head -c 300 || true)
            fi
            echo "Przyczyna z zapisu rozmowy: ${reason:-brak}"

            if printf '%s' "$reason" | grep -qiE 'limit reached|hit your limit|usage limit|rate.?limit|\b429\b'; then
              # Starszy format to „Claude AI usage limit reached|<epoch>" —
              # wtedy zamieniamy znacznik czasu na godzinę po polsku.
              when=""
              epoch=$(printf '%s' "$reason" | grep -oE '\|[0-9]{10}' | tr -d '|' || true)
              if [ -n "$epoch" ]; then
                when=" Limit odnowi się około $(TZ=Europe/Warsaw date -d "@$epoch" '+%H:%M (%d.%m)')."
              elif printf '%s' "$reason" | grep -qi 'reset'; then
                when=" Komunikat: „${reason//$'\n'/ }”."
              fi
              cat > "$RUNNER_TEMP/post.md" <<MD
          ⏳ **Ocena się nie udała — skończył się limit Claude'a**

          Konto, na którym działa ocena, wyczerpało limit użycia.${when} To nie ma nic wspólnego z samym PR-em — [log biegu](${RUN}). Po odnowieniu limitu napisz w komentarzu pod tym PR-em \`@claude\`, żeby spróbować jeszcze raz.
          MD
            else
              cat > "$RUNNER_TEMP/post.md" <<MD
          ⚪ **Ocena się nie udała**

          Claude nie dokończył analizy tego PR-a — [log biegu](${RUN}). Żeby spróbować jeszcze raz, napisz w komentarzu pod tym PR-em \`@claude\`.
          MD
            fi
            {
              echo
              echo "@$author — tym razem bez oceny."
            } >> "$RUNNER_TEMP/post.md"
            kind=failed
            verdict=""
          fi

          url=$(gh pr comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/post.md")
          echo "Komentarz ($kind): $url" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "kind=$kind"
            echo "url=$url"
            echo "author=$author"
            echo "title=$title"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Zwiń zapowiedź
        # Zapowiedź spełniła swoje, gdy pod PR-em stoi ocena albo informacja
        # o porażce. Zwijamy, nie kasujemy — da się ją odwinąć. Ubity bieg
        # zwija swoją zapowiedź też, bo odpowie dopiero następny, a ten jej
        # nie zna. Porażka tego kroku nie może zaczerwienić oceny, która już
        # stoi.
        if: ${{ (!cancelled() && steps.post.outputs.url != '') || (cancelled() && steps.hello.outcome == 'success') }}
        continue-on-error: true
        env:
          NODE: ${{ steps.hello.outputs.node }}
        run: |
          source .discord/.github/scripts/guard.sh
          minimize_comment "$NODE"

      - name: Daj znać autorowi na Discordzie
        # Zespół śledzi repo na Discordzie, a @wzmianka z GitHuba tam nikogo
        # nie budzi — stąd osobna wiadomość z prawdziwym pingiem. Discord to
        # dodatek: jego awaria nie może zaczerwienić oceny, która już stoi.
        # Informację o zmienionym workflow wstawia już krok „Ustal PR do
        # oceny” i to on podaje jej dane.
        if: always() && (steps.post.outputs.url != '' || steps.pr.outputs.url != '')
        continue-on-error: true
        env:
          N: ${{ steps.pr.outputs.number }}
          KIND: ${{ steps.post.outputs.kind || steps.pr.outputs.kind }}
          URL: ${{ steps.post.outputs.url || steps.pr.outputs.url }}
          AUTHOR: ${{ steps.post.outputs.author || steps.pr.outputs.author }}
          TITLE: ${{ steps.post.outputs.title || steps.pr.outputs.title }}
          VERDICT: ${{ steps.post.outputs.verdict }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh

          if [ "$KIND" = review ]; then
            discord_send info "" "Ocena Claude'a: #$N $TITLE" "$URL" "@$AUTHOR, $VERDICT"
          elif [ "$KIND" = workflow ]; then
            discord_send grey "" "Claude nie oceni przy otwarciu: #$N $TITLE" "$URL" \
              "@$AUTHOR, PR zmienia workflow oceny — napisz pod nim @claude"
          else
            discord_send grey "" "Ocena Claude'a się nie udała: #$N $TITLE" "$URL" \
              "@$AUTHOR, szczegóły pod PR-em"
          fi
