name: "PR-y: zmiany przez wersję roboczą"

# Gotowy PR nie dostaje pushy (#349). Każda zmiana — poprawki po ocenie
# Claude'a, po recenzji, rozwiązanie konfliktu — idzie przez wersję roboczą,
# a oznaczenie PR-a jako gotowego („Ready for review") uruchamia ponowną ocenę
# w claude-review-pr.yml. Tu pilnujemy dwóch wejść do wersji roboczej:
#
#  • push, który zmienia zmiany gotowego PR-a, przestawia go na wersję roboczą.
#    Push, po którym PR wnosi do bazy to samo co przed nim (samo dociągnięcie
#    bazy: „Update branch", merge bazy bez poprawek, rebase), zostawia PR
#    gotowym, bo ocena nie miałaby czego oglądać. Rozstrzyga `same_changes`
#    w drafts.sh. Taki push przenosi też zielony status „Ocena Claude'a”
#    (#350) ze starego czubka na nowy — bez tego wymagany status blokowałby
#    merge po każdym „Update branch”. Push, który zmienia zmiany, zostawia
#    nowy czubek bez statusu: merge czeka na ponowną ocenę,
#  • PR otwarty, otwarty ponownie albo oznaczony jako gotowy, który ma konflikt
#    z bazą, wraca do wersji roboczej. Przy konflikcie GitHub nie tworzy biegu
#    `pull_request`, więc ocena i tak by nie ruszyła; autor rozwiązuje konflikt
#    i oznacza PR jako gotowy jeszcze raz. Konflikt, który powstaje później,
#    przez zmianę bazy (merge do `main`, push do niższego piętra stosu),
#    łapie pr-conflicts.yml.
#
# Każda baza poza `stable` — także gałąź PR-a pod nim, czyli PR w stosie
# (#418): stos trafia na `main` w całości, więc każde jego piętro idzie tą
# samą drogą co PR do `main`. Zmiany i konflikt liczymy zawsze względem
# faktycznej bazy PR-a. PR-ów wydaniowych do `stable` nie ruszamy: to
# gotowy `main`, a nie praca, którą się poprawia.
#
# `pull_request_target`, bo działa także przy PR-ze w konflikcie i przy PR-ach
# z forków daje token z zapisem. Kodu z PR-a nie wypakowujemy: `merge-tree`
# i `diff` czytają same obiekty, a skrypty bierzemy z `main`.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches-ignore: [stable]

# Każde przestawienie mówi autorowi, co dalej: komentarzem pod PR-em
# (`to_draft`) i pingiem na Discordzie.
permissions:
  # Zdjęcie próśb o recenzję i komentarz.
  pull-requests: write
  # Skrypty i historia bazy do liczenia konfliktu i porównania zmian, ale
  # przede wszystkim przestawienie na wersję roboczą: GraphQL
  # `convertPullRequestToDraft` (pod `gh pr ready --undo`) odmawia tokenowi
  # bez `contents: write` („Resource not accessible by integration", #417),
  # choć dokumentacja GitHuba wymienia tylko `pull-requests: write`. REST stanu
  # wersji roboczej zmienić nie umie, więc innej drogi nie ma.
  #
  # Zapis do repo przy `pull_request_target` jest bezpieczny tylko dlatego, że
  # ten job nigdy nie wypakowuje ani nie uruchamia kodu z PR-a: skrypty idą
  # z `main` (sparse checkout, `persist-credentials: false`), a czubek PR-a
  # pobieramy wyłącznie jako obiekty gita, które czytają `merge-tree`, `diff`
  # i `patch-id` — nic z nich się nie wykonuje. Z tym tokenem kod z PR-a
  # mógłby pushować do gałęzi PR-ów (`main` chroni ruleset). Każda zmiana tego
  # pliku musi tę zasadę utrzymać (docs/WORKFLOWS.md, zasada 9).
  contents: write

  # Przeniesienie zielonego statusu „Ocena Claude'a” na nowy czubek po
  # samym dociągnięciu bazy (carry_review_status w drafts.sh).
  statuses: write

jobs:
  to-draft:
    if: >-
      github.repository == 'Metal-Pipe-Org/Metal-Planner'
      && github.event.pull_request.draft == false
    # Push zaraz po „Ready for review" nie może się minąć ze sprawdzeniem
    # konfliktu tego samego PR-a — po kolei, bez ubijania.
    concurrency:
      group: pr-drafts-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      N: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      GIT_REPO: .discord
      # Przestawienie i komentarz robi nasz token, więc discord.yml się o nich
      # nie dowie — autora pingujemy stąd, żeby instrukcja doszła do niego
      # i na GitHubie, i na Discordzie. Tytuł to tekst od ludzi — do basha
      # tylko przez env.
      AUTHOR: ${{ github.event.pull_request.user.login }}
      TITLE: ${{ github.event.pull_request.title }}
      URL: ${{ github.event.pull_request.html_url }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_IDS: ${{ vars.DISCORD_IDS || '{}' }}

    steps:
      - name: Pobierz skrypty i historię main
        uses: actions/checkout@v6
        with:
          ref: main
          path: .discord
          # Pełna historia, bo konflikt i zmiany liczymy od wspólnego przodka
          # PR-a i bazy.
          fetch-depth: 0
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Pobierz bazę i czubek PR-a
        run: |
          git -C .discord fetch -q --no-tags origin \
            "+refs/heads/$BASE:refs/remotes/base" "+refs/pull/$N/head:refs/remotes/pr/$N"

      - name: Push do gotowego PR-a
        if: github.event.action == 'synchronize'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh
          source .discord/.github/scripts/statuses.sh
          source .discord/.github/scripts/drafts.sh

          # Stary czubek po force-pushu bywa już nie do pobrania; wtedy nie da
          # się wykazać, że zmiany są te same, więc liczymy push jako zmianę.
          if git -C .discord fetch -q --no-tags origin "$BEFORE" 2> /dev/null \
              && same_changes refs/remotes/base "$BEFORE" "$AFTER"; then
            echo "#$N: push nie zmienia zmian PR-a (samo dociągnięcie $BASE) — zostaje gotowy." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            carry_review_status "$N" "$BEFORE" "$AFTER"
            exit 0
          fi
          rc=0
          to_draft "$N" "$DRAFT_ON_PUSH" || rc=$?
          # Kod 1: PR już był wersją roboczą — nic nie zrobiliśmy, nie ma
          # o czym pisać. Kod 3: PR wrócił, ale komentarz nie wszedł — ping
          # idzie i tak, a bieg kończy się na czerwono.
          if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then
            discord_send warn "" "🚧 PR wraca do wersji roboczej: #$N $TITLE" "$URL" \
              "Push do gotowego PR-a — po poprawkach oznacz go jako gotowy („Ready for review”), to uruchomi ponowną ocenę" \
              "" "$AUTHOR"
          fi
          [ "$rc" = 0 ] || [ "$rc" = 1 ]

      - name: Konflikt z bazą przy otwarciu albo „Ready for review"
        if: github.event.action != 'synchronize'
        run: |
          set -euo pipefail
          source .discord/.github/scripts/discord.sh
          source .discord/.github/scripts/drafts.sh
          source .discord/.github/scripts/conflicts.sh

          if conflicts_with refs/remotes/base "refs/remotes/pr/$N"; then
            rc=0
            to_draft "$N" "$DRAFT_ON_CONFLICT" || rc=$?
            # Kody jak przy pushu wyżej.
            if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then
              discord_send warn "" "⚔️ Konflikt z $BASE: #$N $TITLE" "$URL" \
                "PR wraca do wersji roboczej — rozwiąż konflikt i oznacz go jako gotowy („Ready for review”)" \
                "" "$AUTHOR"
            fi
            [ "$rc" = 0 ] || [ "$rc" = 1 ]
          fi
