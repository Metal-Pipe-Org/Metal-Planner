<!DOCTYPE html>
<!-- Awaryjna strona service workera: pokazuje się tylko wtedy, gdy nie ma
     ani sieci, ani zapamiętanej powłoki aplikacji. Celowo bez zależności. -->
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brak połączenia — Planer podróży</title>
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf2;
            color: #16202b;
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                  "Helvetica Neue", Arial, sans-serif;
        }
        .card {
            max-width: 340px;
            margin: 16px;
            padding: 24px;
            text-align: center;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(16, 32, 48, 0.14);
        }
        img { width: 72px; height: 72px; }
        h1 { margin: 12px 0 4px; font-size: 19px; }
        p { margin: 0 0 18px; color: #5b6b7c; }
        button {
            border: none;
            border-radius: 10px;
            height: 40px;
            padding: 0 18px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="/static/icons/icon.svg" alt="">
    <h1>Brak połączenia</h1>
    <p>Planer potrzebuje sieci, żeby pobrać rozkład jazdy. Spróbuj ponownie,
        gdy wróci internet.</p>
    <button onclick="location.replace('/')">Spróbuj ponownie</button>
</div>

</body>
</html>
