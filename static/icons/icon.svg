            <path d="M 556 702 L 594 702" stroke="#fff" stroke-width="176" fill="none" stroke-linecap="butt"/>
        </mask>
    </defs>

    <rect width="1024" height="1024" rx="224" ry="224" fill="#2563eb"/>

    <g transform="translate(512 512) scale(1.06) translate(-512 -512)">
