        </g>

        <path d="M 322 424 L 322 462" stroke="#2c343c" stroke-width="190" fill="none" stroke-linecap="butt"/>
        <g mask="url(#kolnierz-pion)">
            <rect width="1024" height="1024" fill="#98a3ae"/>
            <path d="M 322 424 L 322 462" stroke="#5b656f" stroke-width="73" fill="none" stroke-linecap="butt"
                  transform="translate(-72 0)"/>
            <path d="M 322 424 L 322 462" stroke="#e3e9ef" stroke-width="55" fill="none" stroke-linecap="butt"
