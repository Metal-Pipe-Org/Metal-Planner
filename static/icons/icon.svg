<!-- Źródło ikony aplikacji: ta sama geometria co pliki PNG obok.
     Motyw: trasa poprowadzona metalową rurą - start, kolano, cel. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <mask id="rura" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect width="1024" height="1024" fill="#000"/>
            <path d="M 322 300 L 322 606 Q 322 702 418 702 L 716 702" stroke="#fff" stroke-width="146"
